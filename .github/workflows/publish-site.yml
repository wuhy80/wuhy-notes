name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "技术笔记/**"
      - "大模型/**"
      - "Ontology/**"
      - "Golang编程/**"
      - "Rust编程/**"
      - "读书笔记/**"
      - "英语学习/**"
      - "数学学习/**"
      - "网址收藏/**"
      - "AI开发Demo/**"
      - "附件/**"
      - "scripts/reader/**"
      - "scripts/site-assets/**"
      - "scripts/site-custom.scss"
      - "scripts/lab-widgets.js"
      - "scripts/build-md-reader.mjs"
      - "scripts/preview-md-reader.mjs"
      - "scripts/prepare-site-mirror.mjs"
      - "scripts/verify-reader.mjs"
      - "scripts/export-public.ps1"
      - "scripts/fix-cjk-emphasis.cjs"
      - "scripts/check-bilingual.mjs"
      - "scripts/build-vocab.mjs"
      - "cloudflare/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-site.yml"
  workflow_run:
    workflows: ["AI 早报归档"]
    types: [completed]
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VAULT_DIR: ${{ github.workspace }}
      SITE_ROOT: '${{ github.workspace }}\_site\md-reader-export'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: 安装阅读器依赖
        run: npm ci --no-audit --no-fund
      - name: 编码与路由校验
        run: |
          node scripts/check-bom.mjs
          npm test
      - name: 导出公开 Markdown、构建阅读器
        run: npm run reader:build
      - name: 校验双语笔记与 Dataview
        run: |
          node scripts/check-bilingual.mjs _site/md-reader/notes/英语学习
          node scripts/test-dataview-lite.mjs _site/md-reader/static/vault-meta.json _site/md-reader/notes
      - name: 保留公开产物（供搜索索引同步）
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: _site/md-reader/
          retention-days: 7
      - name: 发布正式站点
        run: npx --yes wrangler@4 pages deploy _site/md-reader --project-name wuhy-notes --branch main --commit-dirty=true
      - name: 检查正式站点
        run: node scripts/verify-reader.mjs https://wuhy-notes.pages.dev/ _site/md-reader/index.json
      - name: 准备国内静态镜像
        run: node scripts/prepare-site-mirror.mjs
      # 国内镜像：失败必须让整条流水线标红（不再 continue-on-error），并做三重校验：
      #   1. 传输：tar 管道失败自动重试 3 次；
      #   2. 内容：远端 index.json / BUILD.json 的 sha256 必须与本地一致（防止半包）；
      #   3. 切换后：再验一次 /var/www/wuhy-notes/index.json，并核对 BUILD.json 的 runId。
      - name: 同步国内镜像
        shell: bash
        env:
          WUHY_SSH_KEY: ${{ secrets.WUHY_SERVER_SSH_KEY }}
          WUHY_KNOWN_HOSTS: ${{ secrets.WUHY_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${WUHY_SSH_KEY:-}" ] && [ -n "${WUHY_KNOWN_HOSTS:-}" ] || fail "未配置国内镜像凭据（WUHY_SERVER_SSH_KEY / WUHY_SERVER_KNOWN_HOSTS）"
          WS="$(cygpath -u "$GITHUB_WORKSPACE" 2>/dev/null || echo "$GITHUB_WORKSPACE")"
          PUB="$WS/_site/mirror"
          [ -s "$PUB/index.html" ] || fail "镜像产物缺少 index.html"
          [ -s "$PUB/index.json" ] || fail "镜像产物缺少 index.json"
          [ -s "$PUB/BUILD.json" ] || fail "镜像产物缺少 BUILD.json"

          mkdir -p ~/.ssh
          printf '%s\n' "$WUHY_SSH_KEY" > ~/.ssh/wuhy_deploy_key
          printf '%s\n' "$WUHY_KNOWN_HOSTS" > ~/.ssh/wuhy_deploy_known_hosts
          chmod 600 ~/.ssh/wuhy_deploy_key ~/.ssh/wuhy_deploy_known_hosts
          SSH_OPTS=(-i "$HOME/.ssh/wuhy_deploy_key" -o IdentitiesOnly=yes
                    -o UserKnownHostsFile="$HOME/.ssh/wuhy_deploy_known_hosts"
                    -o StrictHostKeyChecking=yes -o ConnectTimeout=20
                    -o ServerAliveInterval=15 -o ServerAliveCountMax=4
                    -o ControlMaster=auto -o "ControlPath=$HOME/.ssh/wuhy_cm_%r@%h:%p" -o ControlPersist=180)
          HOST=root@47.100.85.94
          NEW="/var/www/wuhy-notes.new-$GITHUB_RUN_ID"

          LOCAL_JSON_SHA="$(sha256sum "$PUB/index.json" | awk '{print $1}')"
          LOCAL_BUILD_SHA="$(sha256sum "$PUB/BUILD.json" | awk '{print $1}')"

          ok=0
          for attempt in 1 2 3; do
            echo "---- 传输尝试 $attempt/3 ----"
            if tar czf - -C "$PUB" . | ssh "${SSH_OPTS[@]}" "$HOST" "rm -rf '$NEW' && mkdir -p '$NEW' && tar xzf - -C '$NEW'"; then
              ok=1
              break
            fi
            echo "尝试 $attempt 失败，10 秒后重试"
            sleep 10
          done
          [ "$ok" = 1 ] || fail "三次传输均失败：GitHub Runner 到 47.100.85.94 的 SSH 不可用"

          ssh "${SSH_OPTS[@]}" "$HOST" "test -s '$NEW/index.html' && test -s '$NEW/index.json' && test -s '$NEW/BUILD.json'" || fail "远端解包后缺少 index.html / index.json / BUILD.json"

          REMOTE_JSON_SHA="$(ssh "${SSH_OPTS[@]}" "$HOST" "sha256sum '$NEW/index.json'" | awk '{print $1}')"
          REMOTE_BUILD_SHA="$(ssh "${SSH_OPTS[@]}" "$HOST" "sha256sum '$NEW/BUILD.json'" | awk '{print $1}')"
          [ "$REMOTE_JSON_SHA" = "$LOCAL_JSON_SHA" ] || fail "传输校验失败：远端 index.json sha256 与本地不一致"
          [ "$REMOTE_BUILD_SHA" = "$LOCAL_BUILD_SHA" ] || fail "传输校验失败：远端 BUILD.json sha256 与本地不一致"

          ssh "${SSH_OPTS[@]}" "$HOST" "if [ -d /var/www/wuhy-notes ]; then mv /var/www/wuhy-notes /var/www/wuhy-notes.old-$GITHUB_RUN_ID; fi && mv '$NEW' /var/www/wuhy-notes && rm -rf /var/www/wuhy-notes.old-$GITHUB_RUN_ID" || fail "原子切换 /var/www/wuhy-notes 失败"

          FINAL_JSON_SHA="$(ssh "${SSH_OPTS[@]}" "$HOST" "sha256sum /var/www/wuhy-notes/index.json" | awk '{print $1}')"
          [ "$FINAL_JSON_SHA" = "$LOCAL_JSON_SHA" ] || fail "切换后校验失败：/var/www/wuhy-notes/index.json sha256 不一致"

          echo "国内镜像同步成功：run=${GITHUB_RUN_ID:-local} index.json sha256=$FINAL_JSON_SHA"
      - name: 写入运行摘要
        if: always()
        shell: pwsh
        run: |
          @'
          ## Markdown 阅读站点
          正式入口：https://wuhy-notes.pages.dev/

          正文以 MD 发布，浏览器按需解析；搜索索引由独立工作流同步。
          '@ | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $report = Join-Path $env:SITE_ROOT '_reports/SUMMARY.md'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report -Encoding UTF8 | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
