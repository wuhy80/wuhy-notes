name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "技术笔记/**"
      - "大模型/**"
      - "Ontology/**"
      - "Golang编程/**"
      - "Rust编程/**"
      - "读书笔记/**"
      - "英语学习/**"
      - "数学学习/**"
      - "网址收藏/**"
      - "AI开发Demo/**"
      - "附件/**"
      - "scripts/reader/**"
      - "scripts/site-assets/**"
      - "scripts/site-custom.scss"
      - "scripts/lab-widgets.js"
      - "scripts/build-md-reader.mjs"
      - "scripts/preview-md-reader.mjs"
      - "scripts/prepare-site-mirror.mjs"
      - "deploy/**"
      - "scripts/verify-reader.mjs"
      - "scripts/export-public.ps1"
      - "scripts/fix-cjk-emphasis.cjs"
      - "scripts/check-bilingual.mjs"
      - "scripts/build-vocab.mjs"
      - "cloudflare/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-site.yml"
  workflow_run:
    workflows: ["AI 早报归档"]
    types: [completed]
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VAULT_DIR: ${{ github.workspace }}
      SITE_ROOT: '${{ github.workspace }}\_site\md-reader-export'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: 安装阅读器依赖
        run: npm ci --no-audit --no-fund
      - name: 编码与路由校验
        run: |
          node scripts/check-bom.mjs
          npm test
      - name: 导出公开 Markdown、构建阅读器
        run: npm run reader:build
      - name: 校验双语笔记与 Dataview
        run: |
          node scripts/check-bilingual.mjs _site/md-reader/notes/英语学习
          node scripts/test-dataview-lite.mjs _site/md-reader/static/vault-meta.json _site/md-reader/notes
      - name: 保留公开产物（供搜索索引同步）
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: _site/md-reader/
          retention-days: 7
      - name: 发布正式站点
        run: npx --yes wrangler@4 pages deploy _site/md-reader --project-name wuhy-notes --branch main --commit-dirty=true
      - name: 检查正式站点
        run: node scripts/verify-reader.mjs https://wuhy-notes.pages.dev/ _site/md-reader/index.json
      - name: 准备国内静态镜像
        run: node scripts/prepare-site-mirror.mjs
      # 国内镜像改「拉取模式」：CI 只把产物推到 site-mirror 分支，服务器上的
      # systemd timer（deploy/wuhy-site-sync.sh）拉取、校验、原子切换并 reload nginx。
      # 不再依赖 GitHub Runner 主动 SSH 进服务器，Runner 出口 IP 变化不会导致同步失败。
      - name: 发布国内镜像产物（site-mirror 分支）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WS="$(cygpath -u "$GITHUB_WORKSPACE" 2>/dev/null || echo "$GITHUB_WORKSPACE")"
          PUB="$WS/_site/mirror"
          [ -s "$PUB/index.html" ] || { echo "::error::镜像产物缺少 index.html"; exit 1; }
          [ -s "$PUB/index.json" ] || { echo "::error::镜像产物缺少 index.json"; exit 1; }
          [ -s "$PUB/BUILD.json" ] || { echo "::error::镜像产物缺少 BUILD.json"; exit 1; }
          cd "$PUB"
          git init -q
          git checkout -q -b site-mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A
          git commit -q -m "mirror build run=${GITHUB_RUN_ID} sha=${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin site-mirror
          echo "已发布 site-mirror：$(git rev-parse --short HEAD)"

      - name: 写入运行摘要
        if: always()
        shell: pwsh
        run: |
          @'
          ## Markdown 阅读站点
          正式入口：https://wuhy-notes.pages.dev/

          正文以 MD 发布，浏览器按需解析；搜索索引由独立工作流同步。
          '@ | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $report = Join-Path $env:SITE_ROOT '_reports/SUMMARY.md'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report -Encoding UTF8 | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
