name: Publish Markdown reader preview

on:
  workflow_dispatch:

concurrency:
  group: publish-md-reader-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VAULT_DIR: ${{ github.workspace }}
      SITE_ROOT: '${{ github.workspace }}\_site\md-reader-export'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: 安装阅读器依赖
        run: npm ci --no-audit --no-fund
      - name: 检查脚本编码与路径解析
        run: |
          node scripts/check-bom.mjs
          npm test
      - name: 导出公开 MD、打包阅读器（不构建 Quartz、不更新 AI 索引）
        run: npm run reader:build
      - name: 上传可下载的预览产物
        uses: actions/upload-artifact@v4
        with:
          name: markdown-reader-preview
          path: _site/md-reader/
          retention-days: 7
          include-hidden-files: false
      - name: 发布到独立的 markdown-preview 分支
        run: npx --yes wrangler@4 pages deploy _site/md-reader --project-name wuhy-notes --branch markdown-preview --commit-dirty=true
      - name: 写入运行摘要
        shell: pwsh
        run: |
          @'
          ## Markdown 阅读预览
          - 预览：https://markdown-preview.wuhy-notes.pages.dev/
          - 正文：公开导出目录中的 .md，浏览器按需解析。
          - 正式站点 main 分支保持原发布方式。
          - D1 / AI 绑定应在 Pages 的 Preview 环境单独配置；未配置时仍可按标题、路径和标签搜索。
          '@ | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
