# 把 GitHub Secrets 里的 LLM Key 同步为 Cloudflare Pages 的环境变量。
# 用途：/ask 可视问答的 AI 答案区调用 opencode Go 的 deepseek-v4.1-flash，
#       站点 Worker 需要 OPENCODE_API_KEY 环境变量——它就是 AI_RANK_API_KEY 的值。
# 手动触发（Actions 页面 Run workflow，或由 DSH 代为触发）。
# 注意：Pages 环境变量只对之后的部署生效，同步成功后需要再发一次布。
name: 同步站点 LLM 密钥到 Cloudflare

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 同步 AI_RANK_API_KEY → Pages secret OPENCODE_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY_VALUE: ${{ secrets.AI_RANK_API_KEY }}
        run: |
          if [ -z "$KEY_VALUE" ]; then
            echo "AI_RANK_API_KEY 未配置，跳过"
            exit 0
          fi
          npx -y wrangler@latest pages secret put OPENCODE_API_KEY \
            --project-name wuhy-notes <<< "$KEY_VALUE"
          echo "✅ OPENCODE_API_KEY 已写入 Pages 项目 wuhy-notes"
