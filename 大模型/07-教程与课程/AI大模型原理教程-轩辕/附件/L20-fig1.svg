<svg viewBox="0 0 520 188" role="img" aria-label="单头被迫同时关注主语和宾语，混出一个语义模糊的向量"><text x="70" y="28" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="14" font-weight="700" fill="#C0481E">喜欢</text><text x="70" y="46" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#93A0AC">的查询</text><path d="M 92 30 Q 180 16 250 56" fill="none" stroke="#3E6B8F" stroke-width="3.4" opacity="0.7"></path><path d="M 92 36 Q 180 96 250 110" fill="none" stroke="#4A8B5E" stroke-width="3.4" opacity="0.7"></path><rect x="250" y="42" width="96" height="30" rx="5" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.4"></rect><text x="298" y="62" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#232F3B">他（主语）</text><rect x="250" y="96" width="96" height="30" rx="5" fill="#EDF5EF" stroke="#4A8B5E" stroke-width="1.4"></rect><text x="298" y="116" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#232F3B">风景画（宾语）</text><line x y stroke="#C9BBA2" stroke-width="1.4"></line><line x y stroke="#C9BBA2" stroke-width="1.4"></line><polygon points="394,84 386,80 386,90" fill="#C9BBA2"></polygon><rect x="396" y="60" width="112" height="48" rx="6" fill="#F7E5DB" stroke="#C0481E" stroke-width="1.5"></rect><text x="452" y="80" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#9A3815">一半「他」+ 一半「画」</text><text x="452" y="97" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" font-weight="700" fill="#C0481E">＝四不像</text><text x="260" y="168" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#93A0AC">加权平均把两个本该分开的关系揉成一团，反而谁都没看清</text></svg>