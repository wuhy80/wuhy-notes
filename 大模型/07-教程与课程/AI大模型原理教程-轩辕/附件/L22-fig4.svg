<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" role="img" aria-label="文本进入模型的完整流水线：分词、查ID、查嵌入、加位置"><defs><marker id="tk-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C6B79"></polygon></marker></defs><text x="60" y="20" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#5C6B79">① 文本</text><rect x="8" y="30" width="104" height="30" rx="5" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="60" y="50" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="11" fill="#232F3B">I love strawberry</text><line x1="60" y1="62" x2="60" y2="84" stroke="#5C6B79" stroke-width="1.4" marker-end="url(#tk-arr)"></line><text x="60" y="100" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#3E8F5A">② 切成 token</text><g><rect x="8" y="108" width="104" height="20" rx="3" fill="#EDF5EF" stroke="#3E8F5A" stroke-width="1"></rect><text x="14" y="122" font-family="JetBrains Mono, monospace" font-size="10" fill="#2F8F76">I</text></g><g><rect x="8" y="132" width="104" height="20" rx="3" fill="#EDF5EF" stroke="#3E8F5A" stroke-width="1"></rect><text x="14" y="146" font-family="JetBrains Mono, monospace" font-size="10" fill="#2F8F76"> love</text></g><g><rect x="8" y="156" width="104" height="20" rx="3" fill="#EDF5EF" stroke="#3E8F5A" stroke-width="1"></rect><text x="14" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#2F8F76"> straw</text></g><g><rect x="8" y="180" width="104" height="20" rx="3" fill="#EDF5EF" stroke="#3E8F5A" stroke-width="1"></rect><text x="14" y="194" font-family="JetBrains Mono, monospace" font-size="10" fill="#2F8F76">berry</text></g><line x1="116" y1="150" x2="150" y2="150" stroke="#5C6B79" stroke-width="1.4" marker-end="url(#tk-arr)"></line><text x="210" y="100" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#C0481E">③ 查编号