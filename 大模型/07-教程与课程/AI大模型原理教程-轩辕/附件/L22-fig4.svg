" fill="#3E6B8F">[−0.3, 0.5, …]</text></g><g><rect x="300" y="180" width="136" height="20" rx="3" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1"></rect><text x="368" y="194" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#3E6B8F">[0.4, 0.9, …]</text></g><line x1="438" y1="150" x2="472" y2="150" stroke="#5C6B79" stroke-width="1.4" marker-end="url(#tk-arr)"></line><text x="516" y="100" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#5C6B79">⑤ +位置</text><rect x="478" y="120" width="76" height="60" rx="6" fill="#F0EDE6" stroke="#5C6B79" stroke-width="1.5"></rect><text x="516" y="146" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">进入</text><text x="516" y="162" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#5C6B79">Transformer</text><text x="280" y="222" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#93A0AC">文本 → token → 整数 ID → 向量 → 加位置 → 注意力层。分词器，是这条流水线的第一道工序。</text></svg>