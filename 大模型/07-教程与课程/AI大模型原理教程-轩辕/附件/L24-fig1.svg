<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="残差连接：两条路"><defs><marker id="res-arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#3E6B8F"></polygon></marker><marker id="res-arr2" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#4A8B5E"></polygon></marker></defs><rect x="220" y="10" width="120" height="28" rx="5" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="280" y="29" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">输入 x</text><line x1="280" y1="38" x2="280" y2="60" stroke="#3E6B8F" stroke-width="2" marker-end="url(#res-arr)"></line><rect x="190" y="60" width="180" height="46" rx="6" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="2"></rect><text x="280" y="86" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#3E6B8F">f(x)（注意力 or FFN）</text><text x="280" y="100" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">梯度：∂f/∂x，可能很小</text><line x1="280" y1="106" x2="280" y2="140" stroke="#3E6B8F" stroke-width="2" marker-end="url(#res-arr)"></line><line x1="210" y1="24" x2="170" y2="24" stroke="#4A8B5E" stroke-width="2" stroke-dasharray="5,3"></line><line x1="170" y1="24" x2="170" y2="148" stroke="#4A8B5E" stroke-width="2" stroke-dasharray="5,3"></line><line x1="170" y1="148" x2="230" y2="148" stroke="#4A8B5E" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#res-arr2)"></line><text x="136" y="90" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#4A8B5E">捷径 x</text><text x="136" y="104" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#4A8B5E">梯度：1</text><rect x="240" y="138" width="80" height="28" rx="5" fill="#EDF5EF" stroke="#4A8B5E" stroke-width="1.5"></rect><text x="280" y="157" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#4A8B5E">f(x) + x</text><line x1="280" y1="166" x2="280" y2="186" stroke="#5C6B79" stroke-width="2" marker-end="url(#res-arr)"></line><text x="280" y="198" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#5C6B79">输出 y</text></svg>