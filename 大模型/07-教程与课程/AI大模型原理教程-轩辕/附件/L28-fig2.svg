<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 178" role="img" aria-label="白盒分布蒸馏 vs 黑盒序列蒸馏"><defs><marker id="ds-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C6B79"></polygon></marker></defs><text x="20" y="20" font-family="Noto Sans SC, sans-serif" font-size="11.5" font-weight="700" fill="#3E6B8F">① 白盒 · 分布蒸馏（经典）</text><rect x="20" y="32" width="90" height="36" rx="5" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.5"></rect><text x="65" y="54" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#C0481E">教师模型</text><line x1="110" y1="50" x2="146" y2="50" stroke="#5C6B79" stroke-width="1.3" marker-end="url(#ds-arr)"></line><rect x="148" y="32" width="150" height="36" rx="5" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.4"></rect><text x="223" y="48" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#3E6B8F">每步完整概率分布</text><text x="223" y="62" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#93A0AC">[0.64, 0.14, 0.11, …]</text><line x1="300" y1="50" x2="336" y2="50" stroke="#5C6B79" stroke-width="1.3" marker-end="url(#ds-arr)"></line><rect x="338" y="32" width="150" height="36" rx="5" fill="#EDF5EF" stroke="#4A8B5E" stroke-width="1.4"></rect><text x="413" y="54" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#2F8F76">学生用 KL 对齐分布</text><text x="500" y="52" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#93A0AC">需</text><text x="500" y="64" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#93A0AC">白盒</text><text x="20" y="104" font-family="Noto Sans SC, sans-serif" font-size="11.5" font-weight="700" fill="#B07A1E">② 黑盒 · 序列蒸馏（API 时代主流）</text><rect x="20" y="116" width="90" height="36" rx="5" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.5"></rect><text x="65" y="138" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#C0481E">教师（API）</text><line x1="110" y1="134" x2="146" y2="134" stroke="#5C6B79" stroke-width="1.3" marker-end="url(#ds-arr)"></line><rect x="148" y="116" width="150" height="36" rx="5" fill="#F5F0E8" stroke="#DCD2BF" stroke-width="1.2"></rect><text x="223" y="132" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#5C6B79">只给生成的文本/推理</text><text x="223" y="146" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="9" fill="#93A0AC">「巴黎是法国首都……」</text><line x1="300" y1="134" x2="336" y2="134" stroke="#5C6B79" stroke-width="1.3" marker-end="url(#ds-arr)"></line><rect x="338" y="116" width="150" height="36" rx="5" fill="#EDF5EF" stroke="#4A8B5E" stroke-width="1.4"></rect><text x="413" y="138" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#2F8F76">学生当普通 SFT 训</text><text x="500" y="130" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#93A0AC">仅需</text><text x="500" y="142" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#93A0AC">黑盒</text></svg>