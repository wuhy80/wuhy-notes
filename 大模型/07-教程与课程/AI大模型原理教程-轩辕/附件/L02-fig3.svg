<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="点积的几何含义：投影"><line x1="70" y1="165" x2="298" y2="165" stroke="#3E6B8F" stroke-width="2.5"></line><polygon points="310,165 298,170 298,160" fill="#3E6B8F"></polygon><text x="320" y="169" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#3E6B8F" font-weight="700">a</text><line x1="70" y1="165" x2="215" y2="72" stroke="#C0481E" stroke-width="2.5"></line><polygon points="225,65 218,76 212,67" fill="#C0481E"></polygon><text x="233" y="60" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#C0481E" font-weight="700">b</text><line x1="225" y1="65" x2="225" y2="165" stroke="#93A0AC" stroke-width="1.5" stroke-dasharray="5 3"></line><path d="M 225,155 L 215,155 L 215,165" fill="none" stroke="#93A0AC" stroke-width="1.5"></path><line x1="70" y1="165" x2="225" y2="165" stroke="#5C6B79" stroke-width="3" opacity="0.5"></line><text x="148" y="183" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">|b|cosθ = 投影长度</text><path d="M 120,165 A 50 50 0 0 0 112,138" fill="none" stroke="#232F3B" stroke-width="1.5"></path><text x="96" y="158" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#232F3B">θ</text><text x="240" y="128" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">a·b = |a| × |b|cosθ</text><text x="240" y="148" font-family="JetBrains Mono, monospace" font-size="12" fill="#3E6B8F">    = |a| × 投影</text></svg>