<svg viewBox="0 0 760 200" role="img" aria-label="从 N-gram 到 Transformer 的演变时间线"><defs><marker id="evo-arr" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#C0481E"></polygon></marker></defs><g><line x y stroke="#C9BBA0" stroke-width="2" marker-end="url(#evo-arr)"></line><text x="128" y="96" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">症结：猫 ≠ 小猫</text></g><g><line x y stroke="#C9BBA0" stroke-width="2" marker-end="url(#evo-arr)"></line><text x="256" y="96" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">症结：组合没见过 = 0</text></g><g><line x y stroke="#C9BBA0" stroke-width="2" marker-end="url(#evo-arr)"></line><text x="384" y="96" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">症结：窗口固定</text></g><g><line x y stroke="#C9BBA0" stroke-width="2" marker-end="url(#evo-arr)"></line><text x="512" y="96" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">症结：记不远</text></g><g><line x y stroke="#C9BBA0" stroke-width="2" marker-end="url(#evo-arr)"></line><text x="638" y="96" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">症结：必须串行</text></g><g><circle cx="64" cy="108" r="8" fill="#FFFDF8" stroke="#C0481E" stroke-width="2"></circle><text x="64" y="111" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#C0481E">1</text><text x="64" y="132" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#232F3B">N-gram</text><text x="64" y="148" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#5C6B79">数数</text></g><g><circle cx="192" cy="108" r="8" fill="#FFFDF8" stroke="#C0481E" stroke-width="2"></circle><text x="192" y="111" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight