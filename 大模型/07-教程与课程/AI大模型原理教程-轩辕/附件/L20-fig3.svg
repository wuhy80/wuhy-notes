ns-serif" font-size="11.5" fill="#232F3B">头 1 · 64维（管主谓）</text><rect x="250" y="96" width="156" height="38" rx="5" fill="#FFFDF8" stroke="#5C6B79" stroke-width="1.2"></rect><text x="328" y="120" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#232F3B">头 2 · 64维（管动宾）</text><text x="328" y="156" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#93A0AC">⋯ 一共 8 个头 ⋯</text><rect x="250" y="166" width="156" height="38" rx="5" fill="#FFFDF8" stroke="#5C6B79" stroke-width="1.2"></rect><text x="328" y="190" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#232F3B">头 8 · 64维（管指代）</text><g stroke="#3E6B8F" stroke-width="1.5" fill="none"><path d="M 80 95 L 248 65" marker-end="url(#ah-mh-b)"></path><path d="M 80 125 L 248 115" marker-end="url(#ah-mh-b)"></path><path d="M 80 160 L 248 185" marker-end="url(#ah-mh-b)"></path></g><text x="163" y="84" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#3E6B8F">各读全 512 维</text><rect x="446" y="96" width="94" height="58" rx="5" fill="#F7E5DB" stroke="#C0481E" stroke-width="1.5"></rect><text x="493" y="120" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#9A3815">拼回 512维</text><text x="493" y="138" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#9A3815">→ Wₒ 融合</text><g stroke="#C9BBA2" stroke-width="1.4" fill="none"><path d="M 406 65 L 444 112" marker-end="url(#ah-mh-t)"></path><path d="M 406 115 L 444 122" marker-end="url(#ah-mh-t)"></path><path d="M 406 185 L 444 134" marker-end="url(#ah-mh-t)"></path></g><text x="300" y="238" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#93A0AC">输入端：人人读全文 · 输出端：拼回 512 维一维不少——「切」的是工作空间，不是信息</text></svg>