<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 152" role="img" aria-label="N-gram 眼中的词：每个词是独立符号"><g><rect x="30" y="10" width="60" height="22" rx="4" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="60" y="25" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="13" fill="#232F3B">猫</text><text x="120" y="26" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">「__出门」出现过 <!-- -->800<!-- --> 次</text><rect x="300" y="12" width="200" height="16" rx="3" fill="#3E6B8F" opacity="0.7"></rect></g><g><rect x="30" y="38" width="60" height="22" rx="4" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="60" y="53" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="13" fill="#232F3B">小猫</text><text x="120" y="54" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">「__出门」出现过 <!-- -->3<!-- --> 次</text><rect x="300" y="40" width="0.75" height="16" rx="3" fill="#DCD2BF" opacity="0.7"></rect></g><g><rect x="30" y="66" width="60" height="22" rx="4" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="60" y="81" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="13" fill="#232F3B">猫咪</text><text x="120" y="82" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">「__出门」出现过 <!-- -->12<!-- --> 次</text><rect x="300" y="68" width="3" height="16" rx="3" fill="#DCD2BF" opacity="0.7"></rect></g><g><rect x="30" y="94" width="60" height="22" rx="4" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="60" y="109" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="13" fill="#232F3B">喵</text><text x="120" y="110" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">「__出门」出现过 <!-- -->5<!-- --> 次</text><rect x="300" y="96" width="1.25" height="16" rx="3" fill="#DCD2BF" opacity="0.7"></rect></g><text x="280" y="144" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#C0481E">对 N-gram 来说，「猫」「小猫」「猫咪」是三个毫不相关的词——即使意思几乎相同</text></svg>