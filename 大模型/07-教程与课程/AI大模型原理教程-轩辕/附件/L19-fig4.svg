C6B79">(1)</text><text x="262" y="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#C0481E">↑ 整篇论文的核心，就这一行</text><text x="262" y="316" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#93A0AC">这一站，我们就用前几站亲手造的零件，把它拼出来</text></svg>