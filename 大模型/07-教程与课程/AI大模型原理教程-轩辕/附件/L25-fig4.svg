<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 172" role="img" aria-label="RLHF 的强化学习循环：生成、打分、更新"><defs><marker id="rl-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3E6B8F"></polygon></marker></defs><rect x="40" y="56" width="130" height="48" rx="8" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="2"></rect><text x="105" y="76" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11.5" font-weight="700" fill="#3E6B8F">语言模型</text><text x="105" y="92" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#5C6B79">（正在被训练）</text><line x1="170" y1="64" x2="230" y2="64" stroke="#5C6B79" stroke-width="1.4" marker-end="url(#rl-arr)"></line><text x="200" y="56" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#93A0AC">生成回答</text><rect x="232" y="48" width="96" height="32" rx="5" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="280" y="68" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#5C6B79">一个回答</text><line x1="328" y1="64" x2="388" y2="64" stroke="#5C6B79" stroke-width="1.4" marker-end="url(#rl-arr)"></line><rect x="390" y="48" width="130" height="48" rx="8" fill="#FDF6EC" stroke="#C0481E" stroke-width="2"></rect><text x="455" y="68" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11.5" font-weight="700" fill="#C0481E">奖励模型</text><text x="455" y="84" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">打个分</text><path d="M 455 96 q 0 50 -175 50 q -175 0 -175 -42" fill="none" stroke="#4A8B5E" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#rl-arr)"></path><text x="280" y="162" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#4A8B5E">分高 → 提高这种回答的概率；分低 → 压低（梯度上升，第 12 课的近亲）</text></svg>