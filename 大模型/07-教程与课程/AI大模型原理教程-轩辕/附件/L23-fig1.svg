<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 168" role="img" aria-label="理解任务双向、生成任务单向的对比"><defs><marker id="arch-b" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#3E6B8F"></polygon></marker><marker id="arch-a" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#C0481E"></polygon></marker></defs><line x1="280" y1="12" x2="280" y2="126" stroke="#E5DECF" stroke-width="1" stroke-dasharray="3 3"></line><text x="140" y="20" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#3E6B8F">任务 A · 理解</text><text x="140" y="36" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">双向：前后都能看</text><path d="M102 70 Q73 50 44 70" fill="none" stroke="#3E6B8F" stroke-width="1.4" marker-end="url(#arch-b)"></path><path d="M102 70 Q131 50 160 70" fill="none" stroke="#3E6B8F" stroke-width="1.4" marker-end="url(#arch-b)"></path><path d="M102 70 Q160 40 218 70" fill="none" stroke="#3E6B8F" stroke-width="1.4" marker-end="url(#arch-b)"></path><g><rect x="22" y="70" width="44" height="30" rx="5" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="44" y="90" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="15" font-weight="700" fill="#3E6B8F">猫</text></g><g><rect x="80" y="70" width="44" height="30" rx="5" fill="#3E6B8F" stroke="#3E6B8F" stroke-width="0"></rect><text x="102" y="90" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="15" font-weight="700" fill="#FFFFFF">追</text></g><g><rect x="138" y="70" width="80" height="30" rx="5" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="178" y="90" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="15" font-weight="700" fill="#3E6B8F">球</text></g><text x="140" y="120" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">当前处理「追」这个位置：左右都能看</text><text x="420" y="20" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#C0481E">任务 B · 生成</text><text x="420" y="36" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">单向：只能看左边</text><path d="M438 70 Q380 40 322 70" fill="none" stroke="#C0481E" stroke-width="1.4" marker-end="url(#arch-a)"></path><path d="M438 70 Q409 50 380 70" fill="none" stroke="#C0481E" stroke-width="1.4" marker-end="url(#arch-a)"></path><g><rect x="300" y="70" width="44" height="30" rx="5" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.5"></rect><text x="322" y="90" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#C0481E">它</text></g><g><rect x="358" y="70" width="44" height="30" rx="5" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.5"></rect><text x="380" y="90" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#C0481E">最</text></g><g><rect x="416" y="70" width="44" height="30" rx="5" fill="#C0481E" stroke="#C0481E" stroke-width="0"></rect><text x="438" y="90" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">爱</text></g><g><rect x="474" y="70" width="44" height="30" rx="5" fill="#F2EEE6" stroke="#C9BFA8" stroke-width="1.5" stroke-dasharray="4 3"></rect><text x="496" y="90" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#A99C82">未来?</text></g><text x="420" y="120" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">当前处理「爱」这个位置：只能回看左边</text><text x="280" y="152" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" font-weight="600" fill="#232F3B">同一块 Transformer Block，关键差别只在：注意力能不能看见未来</text></svg>