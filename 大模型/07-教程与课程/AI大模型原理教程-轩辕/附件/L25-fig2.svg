<svg viewBox="0 0 560 168" role="img" aria-label="SFT 的对话模板，损失只在回答部分计算"><text x="20" y="20" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#5C6B79">一条 SFT 训练样本（套进对话模板）</text><rect x="20" y="32" width="300" height="40" rx="6" fill="#F2EFE8" stroke="#DCD2BF" stroke-width="1.2"></rect><text x="32" y="48" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#93A0AC"><|user|></text><text x="32" y="64" font-family="Noto Serif SC, serif" font-size="12" fill="#5C6B79">帮我写一封投诉漏水的邮件</text><text x="330" y="56" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#93A0AC">← 只「给定」，不算损失</text><rect x="20" y="84" width="300" height="56" rx="6" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.8"></rect><text x="32" y="100" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#C0481E"><|assistant|></text><text x="32" y="116" font-family="Noto Serif SC, serif" font-size="12" fill="#232F3B">尊敬的房东：我是 3 栋 502 的</text><text x="32" y="132" font-family="Noto Serif SC, serif" font-size="12" fill="#232F3B">租户，近日卫生间出现漏水……</text><text x="330" y="108" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#C0481E">← 只对这一段</text><text x="330" y="124" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#C0481E">计算损失、更新参数</text></svg>