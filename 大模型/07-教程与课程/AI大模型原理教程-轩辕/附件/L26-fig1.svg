<svg viewBox="0 0 560 130" role="img" aria-label="注意力矩阵大小随序列长度爆炸增长"><g><text x="45" y="22" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">1k tokens</text><rect x="52" y="8" width="80" height="18" rx="3" fill="#4A8B5E" opacity="0.65"></rect><text x="140" y="21" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#4A8B5E">100万 次比较（一段文字）</text></g><g><text x="45" y="50" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">8k tokens</text><rect x="52" y="36" width="200" height="18" rx="3" fill="#3E6B8F" opacity="0.65"></rect><text x="260" y="49" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#3E6B8F">6400万 次比较（一篇长文）</text></g><g><text x="45" y="78" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">32k tokens</text><rect x="52" y="64" width="340" height="18" rx="3" fill="#C0481E" opacity="0.65"></rect><text x="400" y="77" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#C0481E">10亿 次比较（一本书）</text></g><g><text x="45" y="106" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">1M tokens</text><rect x="52" y="92" width="380" height="18" rx="3" fill="#8B4A7E" opacity="0.65"></rect><text x="440" y="105" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#8B4A7E">万亿 次比较（一部百科全书）</text></g><text x="280" y="122" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#C0481E">序列长度翻倍，计算量翻 4 倍——O(n²) 涨得吓人</text></svg>