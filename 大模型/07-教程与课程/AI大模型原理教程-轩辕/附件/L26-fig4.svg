<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="标准注意力 vs FlashAttention 的内存访问方式"><text x="130" y="20" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#C0481E">标准：大矩阵反复进出 HBM</text><g><rect x="20" y="30" width="220" height="22" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="130" y="45" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">Q,K,V (HBM)</text></g><g><rect x="20" y="60" width="220" height="22" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="130" y="75" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">QKᵀ → 写回 HBM</text></g><g><rect x="20" y="90" width="220" height="22" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="130" y="105" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">Softmax → 写回 HBM</text></g><g><rect x="20" y="120" width="220" height="22" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="130" y="135" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">× V → 输出</text></g><text x="420" y="20" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#3E6B8F">Flash：分块在 SRAM 算完</text><g><rect x="300" y="30" width="240" height="22" rx="3" fill="#3E6B8F20" stroke="#3E6B8F" stroke-width="1"></rect><text x="420" y="45" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#3E6B8F">分块读 Q,K,V → SRAM</text></g><g><rect x="300" y="60" width="240" height="22" rx="3" fill="#3E6B8F20" stroke="#3E6B8F" stroke-width="1"></rect><text x="420" y="75" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#3E6B8F">SRAM 内在线 softmax</text></g><g><rect x="300" y="90" width="240" height="22" rx="3" fill="#3E6B8F20" stroke="#3E6B8F" stroke-width="1"></rect><text x="420" y="105" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#3E6B8F">只把最终结果写回 HBM</text></g><text x="420" y="125" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#3E6B8F">大矩阵不落地，快 2~4 倍、省显存数倍</text></svg>