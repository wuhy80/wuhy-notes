<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" role="img" aria-label="恒星、黑洞、香蕉三个上下文词给出的预测对比"><text x="100" y="24" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11.5" font-weight="700" fill="#5C6B79">第二个上下文词</text><text x="270" y="24" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11.5" font-weight="700" fill="#3E6B8F">天文性 → h</text><text x="450" y="24" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11.5" font-weight="700" fill="#C0481E">预测「行星」</text><line x1="20" y1="32" x2="520" y2="32" stroke="#DCD2BF" stroke-width="1"></line><g><text x="30" y="60" font-family="Noto Serif SC, serif" font-size="13" font-weight="700" fill="#232F3B">恒星（见过）</text><text x="270" y="60" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#3E6B8F">0.90 → 0.50</text><rect x="372" y="49" width="120" height="16" rx="3" fill="#F4F0E7" stroke="#DCD2BF" stroke-width="0.8"></rect><rect x="372" y="49" width="93.60000000000001" height="16" rx="3" fill="#C0481E" opacity="0.85"></rect><text x="500" y="61" font-family="JetBrains Mono, monospace" font-size="11" fill="#C0481E" font-weight="700">78%</text><line x1="20" y1="70" x2="520" y2="70" stroke="#F5F0E8" stroke-width="1"></line></g><g><text x="30" y="104" font-family="Noto Serif SC, serif" font-size="13" font-weight="700" fill="#232F3B">黑洞（没见过）</text><text x="270" y="104" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#3E6B8F">0.85 → 0.44</text><rect x="372" y="93" width="120" height="16" rx="3" fill="#F4F0E7" stroke="#DCD2BF" stroke-width="0.8"></rect><rect x="372" y="93" width="90" height="16" rx="3" fill="#C0481E" opacity="0.85"></rect><text x="500" y="105" font-family="JetBrains Mono, monospace" font-size="11" fill="#C0481E" font-weight="700">75%</text><line x1="20" y1="114" x2="520" y2="114" stroke="#F5F0E8" stroke-width="1"></line></g><g><text x="30" y="148" font-family="Noto Serif SC, serif" font-size="13" font-weight="700" fill="#93A0AC">香蕉（无关）</text><text x="270" y="148" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#3E6B8F">0.10 → −0.57</text><rect x="372" y="137" width="120" height="16" rx="3" fill="#F4F0E7" stroke="#DCD2BF" stroke-width="0.8"></rect><rect x="372" y="137" width="22.8" height="16" rx="3" fill="#3E6B8F" opacity="0.85"></rect><text x="500" y="149" font-family="JetBrains Mono, monospace" font-size="11" fill="#3E6B8F" font-weight="700">19%</text><line x1="20" y1="158" x2="520" y2="158" stroke="#F5F0E8" stroke-width="1"></line></g><text x="270" y="192" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#93A0AC">向量相近的「恒星 / 黑洞」给出几乎一样的预测；向量很远的「香蕉」立刻翻盘</text></svg>