<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="梯度在计算图中反向流动"><g><rect x="5" y="45" width="110" height="46" rx="6" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="60" y="65" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3E6B8F">x</text><line x1="115" y1="68" x2="185" y2="68" stroke="#5C6B79" stroke-width="1.5"></line><polygon points="185,68 175,63 175,73" fill="#5C6B79"></polygon></g><g><rect x="125" y="45" width="110" height="46" rx="6" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="180" y="65" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3E6B8F">z</text><text x="180" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#93A0AC">=<!-- -->Wx+b</text><line x1="235" y1="68" x2="305" y2="68" stroke="#5C6B79" stroke-width="1.5"></line><polygon points="305,68 295,63 295,73" fill="#5C6B79"></polygon></g><g><rect x="255" y="45" width="110" height="46" rx="6" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="310" y="65" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3E6B8F">a</text><text x="310" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#93A0AC">=<!-- -->ReLU(z)</text><line x1="365" y1="68" x2="435" y2="68" stroke="#5C6B79" stroke-width="1.5"></line><polygon points="435,68 425,63 425,73" fill="#5C6B79"></polygon></g><g><rect x="395" y="45" width="110" height="46" rx="6" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.5"></rect><text x="450" y="65" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#C0481E">L</text><text x="450" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#C0481E">=<!-- -->(a−y)²</text></g><text x="280" y="24" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#3E6B8F">→ 前向传播（计算并保存中间值）</text><path d="M 395 105 L 315 105" stroke="#C0481E" stroke-width="1.5"></path><polygon points="315,105 325,100 325,110" fill="#C0481E"></polygon><path d="M 265 105 L 185 105" stroke="#C0481E" stroke-width="1.5"></path><polygon points="185,105 195,100 195,110" fill="#C0481E"></polygon><path d="M 125 105 L 65 105" stroke="#C0481E" stroke-width="1.5"></path><polygon points="65,105 75,100 75,110" fill="#C0481E"></polygon><text x="280" y="138" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#C0481E">← 反向传播（链式法则逐层传回梯度）</text></svg>