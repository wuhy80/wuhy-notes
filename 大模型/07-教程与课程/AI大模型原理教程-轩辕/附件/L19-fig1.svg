<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="RNN 把整句话压缩进一个固定大小的向量"><g font-family="Noto Serif SC, serif" font-size="15" font-weight="700" fill="#232F3B" text-anchor="middle"><text x="60" y="40">小猫</text><text x="160" y="40">没有</text><text x="260" y="40">过</text><text x="360" y="40">马路</text><text x="460" y="40">…</text></g><g stroke="#93A0AC" stroke-width="1.2"><line x1="60" y1="52" x2="60" y2="86"></line><line x1="160" y1="52" x2="160" y2="86"></line><line x1="260" y1="52" x2="260" y2="86"></line><line x1="360" y1="52" x2="360" y2="86"></line><line x1="460" y1="52" x2="460" y2="86"></line></g><g><rect x="35" y="90" width="50" height="40" fill="#FFFDF8" stroke="#5C6B79"></rect><rect x="135" y="90" width="50" height="40" fill="#FFFDF8" stroke="#5C6B79"></rect><rect x="235" y="90" width="50" height="40" fill="#FFFDF8" stroke="#5C6B79"></rect><rect x="335" y="90" width="50" height="40" fill="#FFFDF8" stroke="#5C6B79"></rect><rect x="435" y="90" width="50" height="40" fill="#FFFDF8" stroke="#5C6B79"></rect><g font-family="JetBrains Mono, monospace" font-size="11" fill="#5C6B79" text-anchor="middle"><text x="60" y="114">h₁</text><text x="160" y="114">h₂</text><text x="260" y="114">h₃</text><text x="360" y="114">h₄</text><text x="460" y="114">h₅</text></g><g stroke="#5C6B79" stroke-width="1.4"><line x1="85" y1="110" x2="135" y2="110"></line><polygon points="135,110 127,106 127,114" fill="#5C6B79"></polygon><line x1="185" y1="110" x2="235" y2="110"></line><polygon points="235,110 227,106 227,114" fill="#5C6B79"></polygon><line x1="285" y1="110" x2="335" y2="110"></line><polygon points="335,110 327,106 327,114" fill="#5C6B79"></polygon><line x1="385" y1="110" x2="435" y2="110"></line><polygon points="435,110 427,106 427,114" fill="#5C6B79"></polygon></g></g><line x1="485" y1="110" x2="545" y2="110" stroke="#C0481E" stroke-width="1.6"></line><polygon points="545,110 537,106 537,114" fill="#C0481E"></polygon><rect x="548" y="84" width="34" height="52" fill="#C0481E"></rect><text x="565" y="160" font-family="JetBrains Mono, monospace" font-size="11" fill="#C0481E" text-anchor="middle">最终向量</text><text x="60" y="200" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#5C6B79">整句话的全部信息，必须挤进右边那个固定大小的「行李箱」。</text><text x="60" y="222" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#5C6B79">句子越长，越早装进去的东西，越容易被压变形。</text></svg>