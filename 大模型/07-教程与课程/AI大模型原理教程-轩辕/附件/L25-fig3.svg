<svg viewBox="0 0 560 176" role="img" aria-label="奖励模型：从人类两两偏好中学会打分"><defs><marker id="rm-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C6B79"></polygon></marker></defs><rect x="16" y="70" width="96" height="32" rx="5" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="64" y="90" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#5C6B79">同一个问题</text><line x y stroke="#5C6B79" stroke-width="1.3" marker-end="url(#rm-arr)"></line><line x y stroke="#5C6B79" stroke-width="1.3" marker-end="url(#rm-arr)"></line><rect x="148" y="32" width="120" height="32" rx="5" fill="#EDF5EF" stroke="#4A8B5E" stroke-width="1.6"></rect><text x="208" y="52" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#2F8F76">回答 A 👍</text><rect x="148" y="108" width="120" height="32" rx="5" fill="#F4F0E7" stroke="#C9BBA2" stroke-width="1.4"></rect><text x="208" y="128" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#93A0AC">回答 B 👎</text><text x="208" y="86" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#93A0AC">人类选 A 更好</text><line x y stroke="#5C6B79" stroke-width="1.3" marker-end="url(#rm-arr)"></line><line x y stroke="#5C6B79" stroke-width="1.3" marker-end="url(#rm-arr)"></line><rect x="332" y="60" width="120" height="52" rx="6" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.8"></rect><text x="392" y="82" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#C0481E">奖励模型</text><text x="392" y="100" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#C0481E">学会：r(A) > r(B)</text><text x="486" y="90" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">→ 能给</text><text x="486" y="104" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">任意回答打分</text><text x="280" y="166" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#93A0AC">人只需做选择题（A 还是 B），「好坏」就被蒸馏进了一个能自动打分的模型</text></svg>