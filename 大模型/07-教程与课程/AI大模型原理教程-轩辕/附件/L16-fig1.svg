<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="FFNN 语言模型结构：词向量 → 拼接 → 神经网络 → 概率"><text x="40" y="20" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#5C6B79">最近 3 个词</text><g><rect x="20" y="30" width="72" height="32" rx="4" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="56" y="51" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#232F3B">围绕</text></g><g><rect x="20" y="74" width="72" height="32" rx="4" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="56" y="95" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#232F3B">黑洞</text></g><g><rect x="20" y="118" width="72" height="32" rx="4" fill="#F5F0E8" stroke="#DCD2BF"></rect><text x="56" y="139" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#232F3B">运转的</text></g><line x1="92" y1="46" x2="130" y2="46" stroke="#DCD2BF" stroke-width="1.5"></line><line x1="92" y1="90" x2="130" y2="90" stroke="#DCD2BF" stroke-width="1.5"></line><line x1="92" y1="134" x2="130" y2="134" stroke="#DCD2BF" stroke-width="1.5"></line><text x="165" y="20" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#3E6B8F">词向量（查表得到）</text><g><rect x="130" y="30" width="160" height="32" rx="4" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="210" y="51" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#3E6B8F">[0.2, −0.7, 0.1, …]</text></g><g><rect x="130" y="74" width="160" height="32" rx="4" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="210" y="95" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#3E6B8F">[0.8, 0.3, −0.5, …]</text></g><g><rect x="130" y="118" width="160" height="32" rx="4" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="210" y="139" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#3E6B8F">[0.1, 0.9, 0.2, …]</text></g><line x1="290" y1="100" x2="320" y2="100" stroke="#DCD2BF" stroke-width="1.5"></line><rect x="320" y="75" width="60" height="50" rx="4" fill="#EDF5EF" stroke="#4A8B5E" stroke-width="1.5"></rect><text x="350" y="98" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#4A8B5E">拼接</text><text x="350" y="113" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#4A8B5E">一长串</text><line x1="380" y1="100" x2="412" y2="100" stroke="#DCD2BF" stroke-width="1.5"></line><rect x="412" y="68" width="64" height="64" rx="8" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.5"></rect><text x="444" y="97" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#C0481E" font-weight="700">神经</text><text x="444" y="112" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#C0481E" font-weight="700">网络</text><line x1="476" y1="100" x2="510" y2="100" stroke="#DCD2BF" stroke-width="1.5"></line><text x="515" y="82" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#C0481E">行星 42%</text><text x="515" y="98" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">天体 18%</text><text x="515" y="114" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#5C6B79">卫星 11%</text><text x="515" y="130" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#93A0AC">…</text><text x="280" y="185" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#4A8B5E">查向量 → 拼成一长串 → 过网络 → 每个词的概率</text></svg>