<svg viewBox="0 0 580 180" role="img" aria-label="余弦相似度计算示例"><rect x="20" y="20" width="250" height="140" rx="6" fill="#F0EDE6" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="145" y="44" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#3E6B8F">A 和 B 的余弦相似度</text><text x="36" y="72" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">A·B = 8×2 + 6×1 = 22</text><text x="36" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">|A| = 10，|B| ≈ 2.24</text><text x="36" y="120" font-family="JetBrains Mono, monospace" font-size="12" fill="#3E6B8F">cos θ = 22/(10×2.24) ≈ 0.98</text><text x="145" y="148" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#3E6B8F">✓ 方向高度一致！</text><rect x="310" y="20" width="250" height="140" rx="6" fill="#F5F0E8" stroke="#5C6B79" stroke-width="1.5"></rect><text x="435" y="44" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#5C6B79">A 和 C 的余弦相似度</text><text x="326" y="72" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">A·C = 8×1 + 6×7 = 50</text><text x="326" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">|A| = 10，|C| ≈ 7.07</text><text x="326" y="120" font-family="JetBrains Mono, monospace" font-size="12" fill="#5C6B79">cos θ = 50/70.7 ≈ 0.71</text><text x="435" y="148" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">方向有明显偏差</text></svg>