<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="人类视角 vs 模型视角：strawberry 的分词方式"><text x="20" y="22" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#5C6B79">人类视角（字母）</text><g><rect x="20" y="30" width="34" height="30" rx="4" fill="#F5F0E8" stroke="#DCD2BF" stroke-width="1"></rect><text x="37" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C6B79" font-weight="400">s</text></g><g><rect x="60" y="30" width="34" height="30" rx="4" fill="#F5F0E8" stroke="#DCD2BF" stroke-width="1"></rect><text x="77" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C6B79" font-weight="400">t</text></g><g><rect x="100" y="30" width="34" height="30" rx="4" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="2"></rect><text x="117" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3E6B8F" font-weight="700">r</text></g><g><rect x="140" y="30" width="34" height="30" rx="4" fill="#F5F0E8" stroke="#DCD2BF" stroke-width="1"></rect><text x="157" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C6B79" font-weight="400">a</text></g><g><rect x="180" y="30" width="34" height="30" rx="4" fill="#F5F0E8" stroke="#DCD2BF" stroke-width="1"></rect><text x="197" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C6B79" font-weight="400">w</text></g><g><rect x="220" y="30" width="34" height="30" rx="4" fill="#F5F0E8" stroke="#DCD2BF" stroke-width="1"></rect><text x="237" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C6B79" font-weight="400">b</text></g><g><rect x="260" y="30" width="34" height="30" rx="4" fill="#F5F0E8" stroke="#DCD2BF" stroke-width="1"></rect><text x="277" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C6B79" font-weight="400">e</text></g><g><rect x="300" y="30" width="34" height="30" rx="4" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="2"></rect><text x="317" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3E6B8F" font-weight="700">r</text></g><g><rect x="340" y="30" width="34" height="30" rx="4" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="2"></rect><text x="357" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3E6B8F" font-weight="700">r</text></g><g><rect x="380" y="30" width="34" height="30" rx="4" fill="#F5F0E8" stroke="#DCD2BF" stroke-width="1"></rect><text x="397" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#5C6B79" font-weight="400">y</text></g><text x="420" y="50" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#3E6B8F" font-weight="700">3 个 r！</text><text x="20" y="85" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#C0481E">模型视角（Token）</text><rect x="20" y="92" width="220" height="22" rx="4" fill="#FDF6EC" stroke="#C0481E" stroke-width="2"></rect><text x="130" y="107" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#C0481E" font-weight="700">strawberry（整体）</text><text x="260" y="107" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#C0481E">→ 一个符号，内部字母看不见</text></svg>