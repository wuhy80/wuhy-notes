<svg viewBox="0 0 560 160" role="img" aria-label="LSTM 对重要内容和无关内容给出不同阀门值的例子"><g><text x="20" y="38" font-family="Noto Serif SC, serif" font-size="12" font-weight="700" fill="#4A8B5E">害怕黑暗（重要）</text><rect x="20" y="46" width="220" height="26" rx="4" fill="#EDF5EF" stroke="#4A8B5E" stroke-width="1"></rect><text x="130" y="64" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#4A8B5E">忘记阀 0.9 保留</text><rect x="260" y="46" width="260" height="26" rx="4" fill="#EDF5EF" stroke="#4A8B5E" stroke-width="1"></rect><text x="390" y="64" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#4A8B5E">写入阀 0.9 大量写入</text></g><g><text x="20" y="108" font-family="Noto Serif SC, serif" font-size="12" font-weight="700" fill="#93A0AC">吃了早饭（无关）</text><rect x="20" y="116" width="220" height="26" rx="4" fill="#F5F0E8" stroke="#93A0AC" stroke-width="1"></rect><text x="130" y="134" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#93A0AC">忘记阀 0.99 几乎全保留</text><rect x="260" y="116" width="260" height="26" rx="4" fill="#F5F0E8" stroke="#93A0AC" stroke-width="1"></rect><text x="390" y="134" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#93A0AC">写入阀 0.04 几乎不写入</text></g><text x="280" y="148" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#5C6B79">网络自动学会：重要信息大量写入、长期保留；无关信息几乎不碰长期记忆</text></svg>