<svg viewBox="0 0 560 220" role="img" aria-label="一个简单网络的前向和反向传播数值示例"><rect x="10" y="10" width="260" height="120" rx="6" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.5"></rect><text x="140" y="30" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#3E6B8F">① 前向传播</text><text x="24" y="52" font-family="JetBrains Mono, monospace" font-size="12" fill="#3E6B8F">z = w·x = 1.5 × 2 = 3.0</text><text x="24" y="78" font-family="JetBrains Mono, monospace" font-size="12" fill="#3E6B8F">a = z² = 3² = 9.0</text><text x="24" y="104" font-family="JetBrains Mono, monospace" font-size="12" fill="#3E6B8F">L = (a−y)² = (9−6)² = 9.0</text><rect x="290" y="10" width="260" height="160" rx="6" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.5"></rect><text x="420" y="30" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#C0481E">② 反向传播（链式法则）</text><text x="304" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#5C6B79">∂L/∂a = 2(a−y) = 2(9−6) = 6</text><text x="304" y="76" font-family="JetBrains Mono, monospace" font-size="11" fill="#5C6B79">∂a/∂z = 2z = 2×3 = 6</text><text x="304" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#5C6B79">∂z/∂w = x = 2</text><line x y stroke="#DCD2BF" stroke-width="1"></line><text x="304" y="148" font-family="JetBrains Mono, monospace" font-size="11" fill="#C0481E">∂L/∂w = 6 × 6 × 2 = 72</text><rect x="10" y="150" width="260" height="60" rx="6" fill="#F5F0E8" stroke="#5C6B79" stroke-width="1.5"></rect><text x="140" y="170" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#5C6B79">③ 参数更新（α=0.001）</text><text x="24" y="196" font-family="JetBrains Mono, monospace" font-size="12" fill="#5C6B79">w ← 1.5 − 0.001×72 = 1.43</text><text x="24" y="214" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#5C6B79">再算一次：z=2.86，a=8.16，L≈4.65 —— 比原来的 9 小了 ✓</text></svg>