<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="在二维平面上画出「它」的查询向量 q 和三个词的 key 向量，q 几乎与小猫的 key 同向"><defs><marker id="ah-q" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#C0481E"></path></marker><marker id="ah-k" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3E6B8F"></path></marker><marker id="ah-ax" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#93A0AC"></path></marker></defs><g stroke="#EBE3D4" stroke-width="1" stroke-dasharray="3 3"><line x1="210" y1="60" x2="210" y2="250"></line><line x1="310" y1="60" x2="310" y2="250"></line><line x1="110" y1="150" x2="420" y2="150"></line></g><line x1="70" y1="250" x2="520" y2="250" stroke="#93A0AC" stroke-width="1.4" marker-end="url(#ah-ax)"></line><line x1="110" y1="275" x2="110" y2="45" stroke="#93A0AC" stroke-width="1.4" marker-end="url(#ah-ax)"></line><g font-family="JetBrains Mono, monospace" font-size="10" fill="#93A0AC" text-anchor="middle"><text x="210" y="265">1</text><text x="310" y="265">2</text><text x="98" y="154">1</text></g><text x="360" y="244" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#5C6B79">「动物 / 主语」方向</text><text x="120" y="58" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#5C6B79">「疲惫 / 状态」方向</text><line x1="110" y1="250" x2="226" y2="250" stroke="#3E6B8F" stroke-width="2" marker-end="url(#ah-k)"></line><line x1="110" y1="250" x2="110" y2="154" stroke="#3E6B8F" stroke-width="2" marker-end="url(#ah-k)"></line><line x1="110" y1="250" x2="124" y2="250" stroke="#3E6B8F" stroke-width="2" marker-end="url(#ah-k)"></line><line x1="110" y1="250" x2="306" y2="230" stroke="#C0481E" stroke-width="3" marker-end="url(#ah-q)"></line><g font-family="JetBrains Mono, monospace" font-size="12" font-weight="700"><text x="312" y="226" fill="#C0481E">q(它)</text><text x="232" y="244" fill="#3E6B8F">k(小猫)</text><text x="118" y="150" fill="#3E6B8F">k(累)</text><text x="128" y="272" fill="#3E6B8F" font-size="10" font-weight="400">k(它)·很短</text></g><text x="330" y="92" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">q 与 k(小猫) 几乎同向，</text><text x="330" y="110" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#5C6B79">夹角最小 → 点积最大 →</text><text x="330" y="128" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#C0481E">分到的注意力最多。</text></svg>