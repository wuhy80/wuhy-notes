<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="KV 缓存：生成新词时只算新词的 K/V，旧的从缓存取"><text x="20" y="20" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#5C6B79">生成第 5 个词时，前 4 个词的 K/V 早就算过了</text><g><rect x="20" y="36" width="84" height="40" rx="5" fill="#F2EFE8" stroke="#C9BBA2" stroke-width="1.2"></rect><text x="62" y="54" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#93A0AC">I</text><text x="62" y="69" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#93A0AC">K,V 已缓存 ✓</text></g><g><rect x="112" y="36" width="84" height="40" rx="5" fill="#F2EFE8" stroke="#C9BBA2" stroke-width="1.2"></rect><text x="154" y="54" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#93A0AC">love</text><text x="154" y="69" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#93A0AC">K,V 已缓存 ✓</text></g><g><rect x="204" y="36" width="84" height="40" rx="5" fill="#F2EFE8" stroke="#C9BBA2" stroke-width="1.2"></rect><text x="246" y="54" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#93A0AC">this</text><text x="246" y="69" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#93A0AC">K,V 已缓存 ✓</text></g><g><rect x="296" y="36" width="84" height="40" rx="5" fill="#F2EFE8" stroke="#C9BBA2" stroke-width="1.2"></rect><text x="338" y="54" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" fill="#93A0AC">sunny</text><text x="338" y="69" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#93A0AC">K,V 已缓存 ✓</text></g><rect x="388" y="36" width="84" height="40" rx="5" fill="#FDF6EC" stroke="#C0481E" stroke-width="2"></rect><text x="430" y="54" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="12" font-weight="700" fill="#C0481E">day</text><text x="430" y="69" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#C0481E">只算这一个！</text><text x="280" y="112" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#5C6B79">没缓存：每步重算全部 → 生成 n 个词总共 O(n²)</text><text x="280" y="132" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#3E8F5A">有缓存：每步只算 1 个 → 每步 O(n)，省掉大量重复</text></svg>