<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" role="img" aria-label="三种 Transformer 架构：仅编码器、仅解码器、编码器-解码器"><text x="90" y="20" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#3E6B8F">仅编码器</text><rect x="40" y="32" width="100" height="48" rx="6" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.8"></rect><text x="90" y="52" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#3E6B8F">双向理解</text><text x="90" y="68" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#93A0AC">BERT</text><text x="90" y="104" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#5C6B79">分类 · 问答 · 提取</text><text x="280" y="20" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#C0481E">仅解码器</text><rect x="230" y="32" width="100" height="48" rx="6" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.8"></rect><text x="280" y="52" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#C0481E">掩码生成</text><text x="280" y="68" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#93A0AC">GPT · Claude</text><text x="280" y="104" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9.5" fill="#5C6B79">写作 · 对话 · 代码</text><text x="470" y="20" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#4A8B5E">编码器-解码器</text><rect x="418" y="32" width="48" height="48" rx="6" fill="#EBF2F8" stroke="#3E6B8F" stroke-width="1.6"></rect><text x="442" y="60" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#3E6B8F">编码器</text><rect x="482" y="32" width="48" height="48" rx="6" fill="#FDF6EC" stroke="#C0481E" stroke-width="1.6"></rect><text x="506" y="60" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#C0481E">解码器</text><line x1="466" y1="56" x2="482" y2="56" stroke="#4A8B5E" stroke-width="2" marker-end="url(#ar-arr2)"></line><defs><marker id="ar-arr2" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#4A8B5E"></polygon></marker></defs><text x="474" y="96" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#4A8B5E">交叉注意力</text><text x="474" y="108" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="9" fill="#93A0AC">T5 · 翻译</text><line x1="20" y1="130" x2="540" y2="130" stroke="#E2D8C6" stroke-width="1"></line><text x="280" y="152" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#5C6B79">交叉注意力＝解码器生成时，回头去查编码器已经读懂的输入</text><text x="280" y="174" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#93A0AC">编码器先理解输入，解码器再边参考输入边生成输出</text><text x="280" y="196" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10.5" fill="#93A0AC">最适合翻译、摘要这类“读一段，再写一段”的任务</text></svg>