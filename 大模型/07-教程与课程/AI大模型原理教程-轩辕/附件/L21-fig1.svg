<svg viewBox="0 0 540 222" role="img" aria-label="注意力输出是输入向量的加权平均，永远落在它们围成的范围内"><path d="M180,38 L64,176 L296,176 Z" fill="rgba(62,107,143,0.08)" stroke="#BDD2E3" stroke-width="1.2" stroke-dasharray="4 3"></path><circle cx="180" cy="38" r="5" fill="#3E6B8F"></circle><text x="180" y="28" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#3E6B8F">词A 的 V</text><circle cx="64" cy="176" r="5" fill="#3E6B8F"></circle><text x="56" y="194" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#3E6B8F">词B 的 V</text><circle cx="296" cy="176" r="5" fill="#3E6B8F"></circle><text x="300" y="194" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#3E6B8F">词C 的 V</text><g stroke="#C9BBA2" stroke-width="1"><line x y></line><line x y></line><line x y></line></g><g font-family="JetBrains Mono, monospace" font-size="9.5" fill="#93A0AC"><text x="186" y="74">0.5</text><text x="104" y="150">0.3</text><text x="238" y="150">0.2</text></g><circle cx="168" cy="107" r="6" fill="#C0481E"></circle><text x="158" y="104" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="10.5" font-weight="700" fill="#C0481E">输出</text><text x="340" y="56" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#C0481E">只是混合</text><text x="340" y="76" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#5C6B79">输出落在已有向量</text><text x="340" y="93" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#5C6B79">围成的范围之内，</text><text x="340" y="110" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#5C6B79">本质是重新调配。</text><text x="340" y="142" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#C0481E">不是深加工</text><text x="340" y="162" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#5C6B79">它擅长“把该看的凑到一起”，</text><text x="340" y="179" font-family="Noto Sans SC, sans-serif" font-size="11.5" fill="#5C6B79">还不等于“算出新结论”。</text></svg>