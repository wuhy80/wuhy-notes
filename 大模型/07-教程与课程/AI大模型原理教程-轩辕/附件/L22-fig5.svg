<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100" role="img" aria-label="中英文同等内容的 token 消耗对比"><g><text x="20" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#232F3B">The quick brown fox</text><text x="300" y="22" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#3E6B8F">→ <!-- -->4<!-- --> tokens</text><text x="400" y="22" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#93A0AC">（每词基本 1 token）</text><g><rect x="20" y="30" width="35" height="14" rx="3" fill="#3E6B8F20" stroke="#3E6B8F" stroke-width="1"></rect><text x="24" y="41" font-family="JetBrains Mono, monospace" font-size="9" fill="#3E6B8F">The</text></g><g><rect x="80" y="30" width="56" height="14" rx="3" fill="#3E6B8F20" stroke="#3E6B8F" stroke-width="1"></rect><text x="84" y="41" font-family="JetBrains Mono, monospace" font-size="9" fill="#3E6B8F"> quick</text></g><g><rect x="140" y="30" width="56" height="14" rx="3" fill="#3E6B8F20" stroke="#3E6B8F" stroke-width="1"></rect><text x="144" y="41" font-family="JetBrains Mono, monospace" font-size="9" fill="#3E6B8F"> brown</text></g><g><rect x="200" y="30" width="44" height="14" rx="3" fill="#3E6B8F20" stroke="#3E6B8F" stroke-width="1"></rect><text x="204" y="41" font-family="JetBrains Mono, monospace" font-size="9" fill="#3E6B8F"> fox</text></g></g><g><text x="20" y="72" font-family="Noto Serif SC, serif" font-size="12" fill="#232F3B">那只敏捷的棕色狐狸</text><text x="300" y="72" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#C0481E">→ <!-- -->8<!-- --> tokens</text><text x="400" y="72" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#93A0AC">（多数汉字要 1 个甚至更多）</text><g><rect x="20" y="80" width="26" height="14" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="24" y="91" font-family="Noto Serif SC, serif" font-size="9" fill="#C0481E">那只</text></g><g><rect x="80" y="80" width="17" height="14" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="84" y="91" font-family="Noto Serif SC, serif" font-size="9" fill="#C0481E">敏</text></g><g><rect x="140" y="80" width="17" height="14" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="144" y="91" font-family="Noto Serif SC, serif" font-size="9" fill="#C0481E">捷</text></g><g><rect x="200" y="80" width="17" height="14" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="204" y="91" font-family="Noto Serif SC, serif" font-size="9" fill="#C0481E">的</text></g><g><rect x="260" y="80" width="17" height="14" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="264" y="91" font-family="Noto Serif SC, serif" font-size="9" fill="#C0481E">棕</text></g><g><rect x="320" y="80" width="17" height="14" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="324" y="91" font-family="Noto Serif SC, serif" font-size="9" fill="#C0481E">色</text></g><g><rect x="380" y="80" width="17" height="14" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="384" y="91" font-family="Noto Serif SC, serif" font-size="9" fill="#C0481E">狐</text></g><g><rect x="440" y="80" width="17" height="14" rx="3" fill="#C0481E20" stroke="#C0481E" stroke-width="1"></rect><text x="444" y="91" font-family="Noto Serif SC, serif" font-size="9" fill="#C0481E">狸</text></g></g></svg>