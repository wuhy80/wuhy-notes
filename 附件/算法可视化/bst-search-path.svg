<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .edge { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; opacity: 0.55; }
      .node { fill: #e2e8f0; stroke: #0f172a; stroke-width: 4; }
      .label { fill: #0f172a; font: 700 24px sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .active { fill: #fbbf24; transform-box: fill-box; transform-origin: center; animation: pulse 1.4s ease-in-out infinite; }
      .path { stroke: #38bdf8; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 12 10; animation: dash 2s linear infinite; }
      .title { fill: #e2e8f0; font: 700 26px sans-serif; }
      @keyframes dash { to { stroke-dashoffset: -44; } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
  </defs>
  <rect width="720" height="240" rx="20" fill="url(#bg)"/>
  <text x="28" y="38" class="title">BST 查找路径</text>

  <path class="edge" d="M220 80 L140 140"/>
  <path class="edge" d="M220 80 L300 140"/>
  <path class="edge" d="M140 140 L100 200"/>
  <path class="edge" d="M140 140 L180 200"/>
  <path class="edge" d="M300 140 L260 200"/>
  <path class="edge" d="M300 140 L340 200"/>

  <path class="path" d="M220 80 L140 140 L180 200"/>

  <circle cx="220" cy="80" r="28" class="node active"/>
  <circle cx="140" cy="140" r="28" class="node active"/>
  <circle cx="180" cy="200" r="28" class="node active"/>
  <circle cx="300" cy="140" r="28" class="node"/>
  <circle cx="100" cy="200" r="28" class="node"/>
  <circle cx="260" cy="200" r="28" class="node"/>
  <circle cx="340" cy="200" r="28" class="node"/>

  <text x="220" y="80" class="label">4</text>
  <text x="140" y="140" class="label">2</text>
  <text x="180" y="200" class="label">3</text>
  <text x="300" y="140" class="label">7</text>
  <text x="100" y="200" class="label">1</text>
  <text x="260" y="200" class="label">5</text>
  <text x="340" y="200" class="label">9</text>
</svg>
