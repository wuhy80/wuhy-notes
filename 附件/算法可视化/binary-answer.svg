<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="二分答案寻找第一个可行值的动画">
  <defs>
    <linearGradient id="answer-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#26384a"/>
    </linearGradient>
    <style>
      .title { fill: #f8fafc; font: 700 25px sans-serif; }
      .caption { fill: #cbd5e1; font: 500 16px sans-serif; }
      .value { fill: #0f172a; font: 700 22px sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .state { fill: #f8fafc; font: 600 15px sans-serif; text-anchor: middle; }
      .cell { stroke: #dbeafe; stroke-width: 2; }
      .bad { fill: #fda4af; }
      .good { fill: #86efac; }
      .probe { fill: none; stroke: #fbbf24; stroke-width: 5; stroke-linejoin: round; }
      .probe-label { fill: #fbbf24; font: 700 17px sans-serif; text-anchor: middle; }
      .frame { opacity: 0; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .good-state { animation: pulse 1.2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="860" height="300" rx="20" fill="url(#answer-bg)"/>
  <text x="32" y="42" class="title">二分答案：找第一个 True</text>
  <text x="32" y="72" class="caption">可行性具有单调性：False False False True True True</text>

  <g transform="translate(82,128)">
    <g transform="translate(0,0)"><rect class="cell bad" width="100" height="58" rx="10"/><text class="value" x="50" y="29">1</text><text class="state" x="50" y="86">False</text></g>
    <g transform="translate(112,0)"><rect class="cell bad" width="100" height="58" rx="10"/><text class="value" x="50" y="29">2</text><text class="state" x="50" y="86">False</text></g>
    <g transform="translate(224,0)"><rect class="cell bad" width="100" height="58" rx="10"/><text class="value" x="50" y="29">3</text><text class="state" x="50" y="86">False</text></g>
    <g transform="translate(336,0)"><rect class="cell good good-state" width="100" height="58" rx="10"/><text class="value" x="50" y="29">4</text><text class="state" x="50" y="86">True</text></g>
    <g transform="translate(448,0)"><rect class="cell good good-state" width="100" height="58" rx="10"/><text class="value" x="50" y="29">5</text><text class="state" x="50" y="86">True</text></g>
    <g transform="translate(560,0)"><rect class="cell good good-state" width="100" height="58" rx="10"/><text class="value" x="50" y="29">6</text><text class="state" x="50" y="86">True</text></g>

    <g class="frame">
      <set attributeName="opacity" to="1" begin="0s" dur="2s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="2s" fill="freeze"/>
      <path class="probe" d="M448 -14 L432 8 L464 8 Z"/>
      <text class="probe-label" x="448" y="-27">mid = 4</text>
    </g>
    <g class="frame">
      <set attributeName="opacity" to="1" begin="2s" dur="2s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="4s" fill="freeze"/>
      <path class="probe" d="M224 -14 L208 8 L240 8 Z"/>
      <text class="probe-label" x="224" y="-27">mid = 3</text>
    </g>
    <g class="frame">
      <set attributeName="opacity" to="1" begin="4s" dur="2.8s" fill="freeze"/>
      <path class="probe" d="M336 -14 L320 8 L352 8 Z"/>
      <text class="probe-label" x="336" y="-27">答案 = 4</text>
    </g>
  </g>
</svg>
