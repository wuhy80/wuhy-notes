<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <style>
      .edge { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; opacity: 0.55; }
      .node { fill: #e5e7eb; stroke: #111827; stroke-width: 4; }
      .label { fill: #111827; font: 700 22px sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .left { stroke: #60a5fa; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 12 10; animation: dash 2s linear infinite; }
      .right { stroke: #f472b6; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 12 10; animation: dash 2s linear infinite reverse; }
      .root { fill: #fbbf24; transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
      .title { fill: #e5e7eb; font: 700 26px sans-serif; }
      @keyframes dash { to { stroke-dashoffset: -44; } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
  </defs>
  <rect width="720" height="280" rx="20" fill="url(#bg2)"/>
  <text x="28" y="38" class="title">LCA 汇合过程</text>

  <path class="edge" d="M360 70 L220 135"/>
  <path class="edge" d="M360 70 L500 135"/>
  <path class="edge" d="M220 135 L160 205"/>
  <path class="edge" d="M220 135 L280 205"/>
  <path class="edge" d="M500 135 L440 205"/>
  <path class="edge" d="M500 135 L560 205"/>

  <path class="left" d="M220 135 L360 70"/>
  <path class="right" d="M500 135 L360 70"/>

  <circle cx="360" cy="70" r="28" class="node root"/>
  <circle cx="220" cy="135" r="28" class="node"/>
  <circle cx="500" cy="135" r="28" class="node"/>
  <circle cx="160" cy="205" r="28" class="node"/>
  <circle cx="280" cy="205" r="28" class="node"/>
  <circle cx="440" cy="205" r="28" class="node"/>
  <circle cx="560" cy="205" r="28" class="node"/>

  <text x="360" y="70" class="label">3</text>
  <text x="220" y="135" class="label">5</text>
  <text x="500" y="135" class="label">1</text>
  <text x="160" y="205" class="label">6</text>
  <text x="280" y="205" class="label">2</text>
  <text x="440" y="205" class="label">0</text>
  <text x="560" y="205" class="label">8</text>
</svg>
