<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Dijkstra 松弛过程动画">
  <defs>
    <style>
      .bg { fill: #f7f4ea; }
      .title { font: 700 24px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #22333b; }
      .note { font: 500 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #5c677d; }
      .label { font: 600 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #355070; }
      .edge { stroke: #94a3b8; stroke-width: 3; fill: none; }
      .w { font: 700 14px 'Consolas', monospace; fill: #495057; }
      .node { fill: #fffdf7; stroke: #355070; stroke-width: 2.5; }
      .settled { fill: #caffbf; }
      .active { fill: #ffd6a5; }
      .relaxed { fill: #bde0fe; }
      .txt { font: 700 18px 'Consolas', 'JetBrains Mono', monospace; fill: #1d3557; text-anchor: middle; dominant-baseline: middle; }
      .panel { fill: #ffffff; stroke: #6c757d; stroke-width: 2; rx: 12; ry: 12; }
      .small { font: 500 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #334155; }
      .frame { opacity: 0; }
    </style>
  </defs>
  <rect class="bg" width="960" height="360"/>
  <text class="title" x="32" y="38">Dijkstra：每次确认当前最近的点，再用它去松弛邻居</text>

  <g>
    <path class="edge" d="M170 170 L320 100"/>
    <path class="edge" d="M170 170 L320 250"/>
    <path class="edge" d="M320 100 L500 170"/>
    <path class="edge" d="M320 250 L500 170"/>
    <path class="edge" d="M500 170 L680 170"/>
    <text class="w" x="240" y="124">2</text>
    <text class="w" x="240" y="236">6</text>
    <text class="w" x="410" y="118">3</text>
    <text class="w" x="410" y="234">1</text>
    <text class="w" x="590" y="154">2</text>

    <circle class="node" cx="170" cy="170" r="28"/><text class="txt" x="170" y="170">S</text>
    <circle class="node" cx="320" cy="100" r="28"/><text class="txt" x="320" y="100">A</text>
    <circle class="node" cx="320" cy="250" r="28"/><text class="txt" x="320" y="250">B</text>
    <circle class="node" cx="500" cy="170" r="28"/><text class="txt" x="500" y="170">C</text>
    <circle class="node" cx="680" cy="170" r="28"/><text class="txt" x="680" y="170">D</text>
  </g>

  <g transform="translate(744,82)">
    <rect class="panel" width="184" height="208"/>
    <text class="label" x="16" y="28">当前 dist</text>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="0s" dur="2s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="2s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 1: 起点 S 的距离是 0，先从它开始扩展。</text>
    <circle class="active" cx="170" cy="170" r="28"/><text class="txt" x="170" y="170">S</text>
    <text class="small" x="764" y="66">S: 0</text>
    <text class="small" x="764" y="90">A: inf</text>
    <text class="small" x="764" y="114">B: inf</text>
    <text class="small" x="764" y="138">C: inf</text>
    <text class="small" x="764" y="162">D: inf</text>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="2s" dur="2.2s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="4.2s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 2: 用 S 松弛邻居，得到 A=2，B=6。当前最近的是 A。</text>
    <circle class="settled" cx="170" cy="170" r="28"/><text class="txt" x="170" y="170">S</text>
    <circle class="active" cx="320" cy="100" r="28"/><text class="txt" x="320" y="100">A</text>
    <circle class="relaxed" cx="320" cy="250" r="28"/><text class="txt" x="320" y="250">B</text>
    <text class="small" x="764" y="66">S: 0 ✓</text>
    <text class="small" x="764" y="90">A: 2</text>
    <text class="small" x="764" y="114">B: 6</text>
    <text class="small" x="764" y="138">C: inf</text>
    <text class="small" x="764" y="162">D: inf</text>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="4.2s" dur="2.2s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="6.4s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 3: 确认 A 后，继续松弛，得到 C = 2 + 3 = 5。</text>
    <circle class="settled" cx="170" cy="170" r="28"/><text class="txt" x="170" y="170">S</text>
    <circle class="settled" cx="320" cy="100" r="28"/><text class="txt" x="320" y="100">A</text>
    <circle class="relaxed" cx="320" cy="250" r="28"/><text class="txt" x="320" y="250">B</text>
    <circle class="active" cx="500" cy="170" r="28"/><text class="txt" x="500" y="170">C</text>
    <text class="small" x="764" y="66">S: 0 ✓</text>
    <text class="small" x="764" y="90">A: 2 ✓</text>
    <text class="small" x="764" y="114">B: 6</text>
    <text class="small" x="764" y="138">C: 5</text>
    <text class="small" x="764" y="162">D: inf</text>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="6.4s" dur="2.2s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="8.6s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 4: 虽然 B 还没出堆，但 C=5 更小，所以先确认 C，再松弛 D=7。</text>
    <circle class="settled" cx="170" cy="170" r="28"/><text class="txt" x="170" y="170">S</text>
    <circle class="settled" cx="320" cy="100" r="28"/><text class="txt" x="320" y="100">A</text>
    <circle class="relaxed" cx="320" cy="250" r="28"/><text class="txt" x="320" y="250">B</text>
    <circle class="settled" cx="500" cy="170" r="28"/><text class="txt" x="500" y="170">C</text>
    <circle class="active" cx="680" cy="170" r="28"/><text class="txt" x="680" y="170">D</text>
    <text class="small" x="764" y="66">S: 0 ✓</text>
    <text class="small" x="764" y="90">A: 2 ✓</text>
    <text class="small" x="764" y="114">B: 6</text>
    <text class="small" x="764" y="138">C: 5 ✓</text>
    <text class="small" x="764" y="162">D: 7</text>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="8.6s" dur="2.4s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="11s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 5: 每次被“确认”的都是当前全局最小 dist，这个性质依赖边权非负。</text>
    <circle class="settled" cx="170" cy="170" r="28"/><text class="txt" x="170" y="170">S</text>
    <circle class="settled" cx="320" cy="100" r="28"/><text class="txt" x="320" y="100">A</text>
    <circle class="settled" cx="320" cy="250" r="28"/><text class="txt" x="320" y="250">B</text>
    <circle class="settled" cx="500" cy="170" r="28"/><text class="txt" x="500" y="170">C</text>
    <circle class="settled" cx="680" cy="170" r="28"/><text class="txt" x="680" y="170">D</text>
    <text class="small" x="764" y="66">S: 0 ✓</text>
    <text class="small" x="764" y="90">A: 2 ✓</text>
    <text class="small" x="764" y="114">B: 6 ✓</text>
    <text class="small" x="764" y="138">C: 5 ✓</text>
    <text class="small" x="764" y="162">D: 7 ✓</text>
  </g>
</svg>
