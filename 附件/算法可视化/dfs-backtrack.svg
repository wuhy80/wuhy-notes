<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="DFS 深入与回溯动画">
  <defs>
    <style>
      .bg { fill: #f7f4ea; }
      .title { font: 700 24px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #22333b; }
      .note { font: 500 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #5c677d; }
      .label { font: 600 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #355070; }
      .node { fill: #fffdf7; stroke: #355070; stroke-width: 2.5; }
      .txt { font: 700 18px 'Consolas', 'JetBrains Mono', monospace; fill: #1d3557; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #9aa6b2; stroke-width: 3; fill: none; }
      .active { fill: #ffd6a5; }
      .done { fill: #caffbf; }
      .back { fill: #f1c0e8; }
      .stackBox { fill: #ffffff; stroke: #6c757d; stroke-width: 2; rx: 10; ry: 10; }
      .frame { opacity: 0; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="360"/>
  <text class="title" x="32" y="38">DFS：沿一条路走到底，走不动了再回溯</text>

  <g>
    <path class="edge" d="M220 110 L150 190"/>
    <path class="edge" d="M220 110 L290 190"/>
    <path class="edge" d="M150 190 L110 280"/>
    <path class="edge" d="M150 190 L190 280"/>
    <path class="edge" d="M290 190 L330 280"/>

    <circle class="node" cx="220" cy="110" r="26"/>
    <text class="txt" x="220" y="110">1</text>
    <circle class="node" cx="150" cy="190" r="26"/>
    <text class="txt" x="150" y="190">2</text>
    <circle class="node" cx="290" cy="190" r="26"/>
    <text class="txt" x="290" y="190">3</text>
    <circle class="node" cx="110" cy="280" r="26"/>
    <text class="txt" x="110" y="280">4</text>
    <circle class="node" cx="190" cy="280" r="26"/>
    <text class="txt" x="190" y="280">5</text>
    <circle class="node" cx="330" cy="280" r="26"/>
    <text class="txt" x="330" y="280">6</text>
  </g>

  <g transform="translate(600,84)">
    <text class="label" x="0" y="-16">递归栈 / 当前路径</text>
    <rect class="stackBox" x="0" y="0" width="220" height="220"/>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="0s" dur="2s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="2s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 1: 从起点 1 出发，先进入第一条分支。</text>
    <circle class="active" cx="220" cy="110" r="26"/>
    <text class="txt" x="220" y="110">1</text>
    <g transform="translate(640,248)">
      <rect class="stackBox active" x="0" y="0" width="140" height="36"/>
      <text class="txt" x="70" y="18">[1]</text>
    </g>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="2s" dur="2s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="4s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 2: 深入到 2，再继续深入到 4。</text>
    <circle class="done" cx="220" cy="110" r="26"/><text class="txt" x="220" y="110">1</text>
    <circle class="done" cx="150" cy="190" r="26"/><text class="txt" x="150" y="190">2</text>
    <circle class="active" cx="110" cy="280" r="26"/><text class="txt" x="110" y="280">4</text>
    <g transform="translate(640,176)">
      <rect class="stackBox done" x="0" y="0" width="140" height="36"/>
      <text class="txt" x="70" y="18">[1]</text>
      <rect class="stackBox done" x="0" y="40" width="140" height="36"/>
      <text class="txt" x="70" y="58">[1,2]</text>
      <rect class="stackBox active" x="0" y="80" width="140" height="36"/>
      <text class="txt" x="70" y="98">[1,2,4]</text>
    </g>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="4s" dur="2s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="6s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 3: 4 没路可走，回溯到 2，再尝试 5。</text>
    <circle class="done" cx="220" cy="110" r="26"/><text class="txt" x="220" y="110">1</text>
    <circle class="back" cx="150" cy="190" r="26"/><text class="txt" x="150" y="190">2</text>
    <circle class="done" cx="110" cy="280" r="26"/><text class="txt" x="110" y="280">4</text>
    <circle class="active" cx="190" cy="280" r="26"/><text class="txt" x="190" y="280">5</text>
    <g transform="translate(640,176)">
      <rect class="stackBox done" x="0" y="0" width="140" height="36"/>
      <text class="txt" x="70" y="18">[1]</text>
      <rect class="stackBox back" x="0" y="40" width="140" height="36"/>
      <text class="txt" x="70" y="58">[1,2]</text>
      <rect class="stackBox active" x="0" y="80" width="140" height="36"/>
      <text class="txt" x="70" y="98">[1,2,5]</text>
    </g>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="6s" dur="2.4s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="8.4s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 4: 左边整棵子树走完，再回到 1，转向 3 和 6。</text>
    <circle class="done" cx="220" cy="110" r="26"/><text class="txt" x="220" y="110">1</text>
    <circle class="done" cx="150" cy="190" r="26"/><text class="txt" x="150" y="190">2</text>
    <circle class="done" cx="110" cy="280" r="26"/><text class="txt" x="110" y="280">4</text>
    <circle class="done" cx="190" cy="280" r="26"/><text class="txt" x="190" y="280">5</text>
    <circle class="done" cx="290" cy="190" r="26"/><text class="txt" x="290" y="190">3</text>
    <circle class="active" cx="330" cy="280" r="26"/><text class="txt" x="330" y="280">6</text>
    <g transform="translate(640,216)">
      <rect class="stackBox done" x="0" y="0" width="140" height="36"/>
      <text class="txt" x="70" y="18">[1]</text>
      <rect class="stackBox done" x="0" y="40" width="140" height="36"/>
      <text class="txt" x="70" y="58">[1,3]</text>
      <rect class="stackBox active" x="0" y="80" width="140" height="36"/>
      <text class="txt" x="70" y="98">[1,3,6]</text>
    </g>
  </g>

  <g class="frame">
    <set attributeName="opacity" to="1" begin="8.4s" dur="2.6s" fill="freeze"/>
    <set attributeName="opacity" to="0" begin="11s" fill="freeze"/>
    <text class="note" x="32" y="72">Step 5: 访问顺序是 1 → 2 → 4 → 5 → 3 → 6，关键是“先深后回头”。</text>
    <circle class="done" cx="220" cy="110" r="26"/><text class="txt" x="220" y="110">1</text>
    <circle class="done" cx="150" cy="190" r="26"/><text class="txt" x="150" y="190">2</text>
    <circle class="done" cx="290" cy="190" r="26"/><text class="txt" x="290" y="190">3</text>
    <circle class="done" cx="110" cy="280" r="26"/><text class="txt" x="110" y="280">4</text>
    <circle class="done" cx="190" cy="280" r="26"/><text class="txt" x="190" y="280">5</text>
    <circle class="done" cx="330" cy="280" r="26"/><text class="txt" x="330" y="280">6</text>
    <text class="label" x="620" y="172">访问顺序</text>
    <text class="txt" x="710" y="212">1 → 2 → 4 → 5 → 3 → 6</text>
  </g>
</svg>
