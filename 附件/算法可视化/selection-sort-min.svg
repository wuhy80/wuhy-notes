<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="选择排序每轮选择未排序区间最小值的动画">
  <defs>
    <linearGradient id="selection-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18212f"/>
      <stop offset="100%" stop-color="#34495e"/>
    </linearGradient>
    <style>
      .title { fill: #f8fafc; font: 700 25px sans-serif; }
      .caption { fill: #cbd5e1; font: 500 16px sans-serif; }
      .value { fill: #172033; font: 700 22px sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .cell { stroke: #e2e8f0; stroke-width: 2; }
      .sorted { fill: #86efac; }
      .scan { fill: #bfdbfe; }
      .minimum { fill: #fbbf24; }
      .frame { opacity: 0; }
      .arrow { stroke: #fbbf24; stroke-width: 5; fill: none; stroke-linecap: round; stroke-dasharray: 10 8; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
    </style>
  </defs>
  <rect width="860" height="300" rx="20" fill="url(#selection-bg)"/>
  <text x="32" y="42" class="title">选择排序：每轮固定一个最小值</text>
  <text x="32" y="72" class="caption">绿色是已排序区，黄色是本轮扫描得到的最小值</text>

  <g transform="translate(70,132)">
    <g class="frame">
      <set attributeName="opacity" to="1" begin="0s" dur="2.5s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="2.5s" fill="freeze"/>
      <rect class="sorted cell" x="0" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="44" y="29">11</text>
      <rect class="minimum cell" x="440" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="484" y="29">11</text>
      <path class="arrow" d="M484 -16 C360 -68 120 -68 44 -16"/>
      <text x="44" y="90" fill="#86efac" font-family="sans-serif" font-size="15" text-anchor="middle">第 1 位</text>
    </g>
    <g class="frame">
      <set attributeName="opacity" to="1" begin="2.5s" dur="2.5s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="5s" fill="freeze"/>
      <rect class="sorted cell" x="0" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="44" y="29">11</text>
      <rect class="sorted cell" x="100" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="144" y="29">12</text>
      <rect class="minimum cell" x="300" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="344" y="29">12</text>
      <path class="arrow" d="M344 -16 C300 -62 190 -62 144 -16"/>
      <text x="144" y="90" fill="#86efac" font-family="sans-serif" font-size="15" text-anchor="middle">第 2 位</text>
    </g>
    <g class="frame">
      <set attributeName="opacity" to="1" begin="5s" dur="3s" fill="freeze"/>
      <rect class="sorted cell" x="0" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="44" y="29">11</text>
      <rect class="sorted cell" x="100" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="144" y="29">12</text>
      <rect class="sorted cell" x="200" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="244" y="29">22</text>
      <rect class="sorted cell" x="300" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="344" y="29">25</text>
      <rect class="sorted cell" x="400" y="0" width="88" height="58" rx="10"/>
      <text class="value" x="444" y="29">64</text>
      <text x="244" y="90" fill="#86efac" font-family="sans-serif" font-size="15" text-anchor="middle">每轮只增加一个已排序位置</text>
    </g>
  </g>
</svg>
