<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460">
  <defs>
    <style>
      .title { font: 700 28px sans-serif; fill: #111827; }
      .label { font: 18px sans-serif; fill: #1f2937; }
      .small { font: 15px sans-serif; fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .axis { stroke: #d1d5db; stroke-width: 1.5; }
      .line1 { stroke: #2563eb; stroke-width: 4; fill: none; }
      .line2 { stroke: #dc2626; stroke-width: 4; fill: none; }
      .line3 { stroke: #16a34a; stroke-width: 7; fill: none; opacity: .75; }
      .point { fill: #111827; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="460" fill="#ffffff"/>
  <text x="40" y="48" class="title">线性方程组的三种解</text>
  <text x="40" y="78" class="small">二维中每个一次方程是一条直线，方程组的解就是直线的交集。</text>

  <rect x="50" y="120" width="300" height="260" class="panel"/>
  <line x1="90" y1="315" x2="310" y2="315" class="axis"/>
  <line x1="200" y1="155" x2="200" y2="345" class="axis"/>
  <path d="M90 330 L310 170" class="line1"/>
  <path d="M90 180 L310 340" class="line2"/>
  <circle cx="200" cy="250" r="7" class="point"/>
  <text x="200" y="405" class="label" text-anchor="middle">唯一解</text>
  <text x="200" y="430" class="small" text-anchor="middle">两条直线交于一个点</text>

  <rect x="390" y="120" width="300" height="260" class="panel"/>
  <line x1="430" y1="315" x2="650" y2="315" class="axis"/>
  <line x1="540" y1="155" x2="540" y2="345" class="axis"/>
  <path d="M430 300 L650 180" class="line1"/>
  <path d="M430 335 L650 215" class="line2"/>
  <text x="540" y="405" class="label" text-anchor="middle">无解</text>
  <text x="540" y="430" class="small" text-anchor="middle">两条直线平行不相交</text>

  <rect x="730" y="120" width="300" height="260" class="panel"/>
  <line x1="770" y1="315" x2="990" y2="315" class="axis"/>
  <line x1="880" y1="155" x2="880" y2="345" class="axis"/>
  <path d="M770 330 L990 175" class="line3"/>
  <path d="M770 330 L990 175" class="line1"/>
  <path d="M770 330 L990 175" class="line2" stroke-dasharray="12 10"/>
  <text x="880" y="405" class="label" text-anchor="middle">无穷多解</text>
  <text x="880" y="430" class="small" text-anchor="middle">两条直线完全重合</text>
</svg>
