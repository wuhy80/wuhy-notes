<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560">
  <defs>
    <style>
      .title { font: 700 28px sans-serif; fill: #111827; }
      .label { font: 18px sans-serif; fill: #1f2937; }
      .small { font: 15px sans-serif; fill: #4b5563; }
      .matrix { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 8; }
      .keep { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .drop { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .accent { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .axis { stroke: #94a3b8; stroke-width: 2; }
      .bar { fill: #2563eb; }
      .bar2 { fill: #cbd5e1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>
  <text x="40" y="48" class="title">SVD 降维：只保留最重要的前 k 个方向</text>
  <text x="40" y="78" class="small">奇异值越大，对原始数据结构的贡献越大；小奇异值通常对应细节或噪声。</text>

  <rect x="70" y="140" width="160" height="220" class="matrix"/>
  <text x="150" y="385" class="label" text-anchor="middle">原始矩阵 A</text>
  <text x="150" y="255" class="label" text-anchor="middle">m × n</text>

  <text x="260" y="260" class="title">≈</text>

  <rect x="330" y="140" width="95" height="220" class="matrix"/>
  <rect x="330" y="140" width="95" height="75" class="keep"/>
  <text x="377" y="385" class="label" text-anchor="middle">Uₖ</text>

  <text x="455" y="260" class="title">×</text>

  <rect x="520" y="170" width="130" height="130" class="matrix"/>
  <rect x="520" y="170" width="55" height="55" class="accent"/>
  <rect x="575" y="225" width="55" height="55" class="accent"/>
  <text x="585" y="385" class="label" text-anchor="middle">Σₖ</text>

  <text x="680" y="260" class="title">×</text>

  <rect x="745" y="140" width="220" height="95" class="matrix"/>
  <rect x="745" y="140" width="80" height="95" class="keep"/>
  <text x="855" y="385" class="label" text-anchor="middle">Vₖᵀ</text>

  <text x="330" y="425" class="small">保留前 k 个奇异向量和奇异值，得到低秩近似 Aₖ。</text>

  <line x1="120" y1="505" x2="480" y2="505" class="axis"/>
  <line x1="120" y1="505" x2="120" y2="445" class="axis"/>
  <rect x="145" y="455" width="26" height="50" class="bar"/>
  <rect x="190" y="470" width="26" height="35" class="bar"/>
  <rect x="235" y="487" width="26" height="18" class="bar2"/>
  <rect x="280" y="494" width="26" height="11" class="bar2"/>
  <rect x="325" y="499" width="26" height="6" class="bar2"/>
  <text x="300" y="540" class="small" text-anchor="middle">奇异值从大到小排列，前 k 个贡献最大</text>

  <rect x="610" y="450" width="330" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="10"/>
  <text x="775" y="478" class="label" text-anchor="middle">降维后的表示</text>
  <text x="775" y="505" class="small" text-anchor="middle">用更少的维度保留主要结构</text>
</svg>
