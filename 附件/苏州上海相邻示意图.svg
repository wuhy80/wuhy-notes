<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700">
  <defs>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; }
      .t  { fill:#333; font-size:13px; text-anchor:middle; }
      .ts { fill:#333; font-size:12px; text-anchor:middle; }
      .tb { fill:#111; font-size:15px; font-weight:bold; text-anchor:middle; }
      .cap{ fill:#555; font-size:12px; text-anchor:middle; }
      .water-fill { fill:#9fc6e8; stroke:#6fa8dc; stroke-width:1.5; }
      .land-sz { fill:#d9ead3; stroke:#38761d; stroke-width:2.5; }
      .land-sh { fill:#cfe2f3; stroke:#1155cc; stroke-width:2.5; }
      .dist-sz { fill:#b6d7a8; stroke:#38761d; stroke-width:1.5; }
      .dist-sh { fill:#a4c2f4; stroke:#1155cc; stroke-width:1.5; }
      .other { fill:#ffe599; stroke:#bf9000; stroke-width:1.5; }
      .zj { fill:#fff2cc; stroke:#b8860b; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="960" height="700" fill="#fdfdf6"/>

  <!-- 标题 -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">苏州 · 上海 相邻示意图</text>

  <!-- 指北针 -->
  <line x1="918" y1="52" x2="918" y2="34" stroke="#555" stroke-width="2"/>
  <polygon points="918,26 913,36 923,36" fill="#555"/>
  <text x="918" y="70" class="ts">北</text>

  <!-- 长江 -->
  <path class="water-fill" d="M 0 95 C 150 86, 300 104, 470 96 C 640 88, 820 88, 960 100 L 960 142 C 820 132, 640 150, 470 140 C 300 130, 150 130, 0 140 Z"/>
  <text x="130" y="124" font-size="18" font-weight="bold" fill="#1c4586">长　江</text>

  <!-- 南通（隔江相望，不接壤） -->
  <rect class="other" x="150" y="42" width="160" height="38" rx="10"/>
  <text x="230" y="66" class="t">南通市（江苏）</text>

  <!-- 崇明岛（属上海） -->
  <ellipse cx="640" cy="118" rx="95" ry="14" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="640" y="123" class="ts">崇明岛（沪）</text>

  <!-- 苏州市 -->
  <rect class="land-sz" x="80" y="160" width="500" height="380" rx="18"/>
  <text x="185" y="184" class="tb" font-size="14">苏州市（江苏）</text>
  <rect class="dist-sz" x="105" y="195" width="120" height="67" rx="8"/>
  <text x="165" y="233" class="t">张家港</text>
  <rect class="dist-sz" x="245" y="195" width="120" height="67" rx="8"/>
  <text x="305" y="233" class="t">常熟</text>
  <rect class="dist-sz" x="385" y="195" width="192" height="67" rx="8"/>
  <text x="481" y="233" class="t">太仓</text>
  <rect class="dist-sz" x="175" y="285" width="170" height="95" rx="8"/>
  <text x="260" y="328" class="tb">苏州市区</text>
  <text x="260" y="352" class="ts">（姑苏·吴中等）</text>
  <rect class="dist-sz" x="395" y="285" width="182" height="95" rx="8"/>
  <text x="486" y="337" class="tb">昆山</text>
  <rect class="dist-sz" x="345" y="415" width="232" height="65" rx="8"/>
  <text x="461" y="458" class="tb">吴江</text>
  <ellipse class="water-fill" cx="150" cy="448" rx="72" ry="44"/>
  <text x="150" y="453" font-size="14" font-weight="bold" fill="#1c4586">太　湖</text>

  <!-- 无锡（苏州以西） -->
  <rect class="other" x="10" y="300" width="62" height="80" rx="10"/>
  <text x="41" y="333" class="t">无</text>
  <text x="41" y="355" class="t">锡</text>

  <!-- 上海市 -->
  <rect class="land-sh" x="580" y="160" width="350" height="380" rx="18"/>
  <text x="845" y="184" class="tb" font-size="14">上海市（直辖市）</text>
  <rect class="dist-sh" x="583" y="195" width="162" height="67" rx="8"/>
  <text x="664" y="233" class="t">嘉定</text>
  <rect class="dist-sh" x="770" y="195" width="150" height="105" rx="8"/>
  <text x="845" y="252" class="t">中心城区</text>
  <rect class="dist-sh" x="583" y="285" width="162" height="170" rx="8"/>
  <text x="664" y="360" class="t">青浦</text>
  <rect class="dist-sh" x="770" y="325" width="150" height="85" rx="8"/>
  <text x="845" y="372" class="t">浦东新区</text>
  <rect class="dist-sh" x="583" y="470" width="337" height="55" rx="8"/>
  <text x="751" y="494" class="tb" font-size="14">上海南部各区</text>
  <text x="751" y="514" class="ts">（闵行·松江·金山·奉贤）</text>

  <!-- 苏沪交界（红色虚线） -->
  <rect x="526" y="146" width="108" height="16" fill="#fdfdf6" opacity="0.92"/>
  <line x1="580" y1="160" x2="580" y2="480" stroke="#cc0000" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="580" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#cc0000">▼ 苏沪交界</text>

  <!-- 苏浙省界 -->
  <line x1="80" y1="548" x2="930" y2="548" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="552" font-size="11" fill="#888">苏浙省界</text>

  <!-- 浙江 -->
  <rect class="zj" x="80" y="560" width="850" height="70" rx="12"/>
  <text x="290" y="601" class="tb" font-size="15">浙江省（湖州 · 嘉兴）</text>

  <!-- 结论 -->
  <text x="480" y="672" text-anchor="middle" font-size="14" font-weight="bold" fill="#a30000">结论：苏州与上海陆地直接接壤 —— 太仓—嘉定、昆山—嘉定/青浦、吴江—青浦</text>
</svg>
