<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1360" height="1000" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">机器学习 24 个常用算法 · 四类地图</text>
  <text x="40" y="76" font-size="13" fill="#64748b">按「数据有没有标签 / 要不要与环境交互」分成四类；每格一句话定位</text>

  <!-- ========== A 监督学习 ========== -->
  <rect x="40" y="100" width="628" height="404" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="62" y="138" font-size="19" font-weight="700" fill="#1e40af">A · 监督学习</text>
  <text x="668" y="138" font-size="12" fill="#3b82f6" text-anchor="end">8 个算法</text>
  <text x="62" y="160" font-size="11.5" fill="#475569">给每个样本一个标签，学「输入 → 输出」的映射</text>

  <rect x="62" y="178" width="285" height="68" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="205" font-size="14" font-weight="700" fill="#1e3a8a">01 线性回归</text>
  <text x="76" y="225" font-size="10.6" fill="#475569">拟合连续值，最小二乘</text>

  <rect x="361" y="178" width="285" height="68" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="375" y="205" font-size="14" font-weight="700" fill="#1e3a8a">02 逻辑回归</text>
  <text x="375" y="225" font-size="10.6" fill="#475569">二分类概率，sigmoid</text>

  <rect x="62" y="258" width="285" height="68" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="285" font-size="14" font-weight="700" fill="#1e3a8a">03 KNN</text>
  <text x="76" y="305" font-size="10.6" fill="#475569">距离投票，惰性学习</text>

  <rect x="361" y="258" width="285" height="68" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="375" y="285" font-size="14" font-weight="700" fill="#1e3a8a">04 朴素贝叶斯</text>
  <text x="375" y="305" font-size="10.6" fill="#475569">条件独立，文本分类</text>

  <rect x="62" y="338" width="285" height="68" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="365" font-size="14" font-weight="700" fill="#1e3a8a">05 决策树</text>
  <text x="76" y="385" font-size="10.6" fill="#475569">递归划分，可解释强</text>

  <rect x="361" y="338" width="285" height="68" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="375" y="365" font-size="14" font-weight="700" fill="#1e3a8a">06 支持向量机</text>
  <text x="375" y="385" font-size="10.6" fill="#475569">最大间隔 + 核技巧</text>

  <rect x="62" y="418" width="285" height="68" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="445" font-size="14" font-weight="700" fill="#1e3a8a">07 随机森林</text>
  <text x="76" y="465" font-size="10.6" fill="#475569">Bagging + 特征随机</text>

  <rect x="361" y="418" width="285" height="68" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="375" y="445" font-size="14" font-weight="700" fill="#1e3a8a">08 梯度提升树</text>
  <text x="375" y="465" font-size="10.6" fill="#475569">Boosting，表格数据王者</text>

  <!-- ========== B 无监督学习 ========== -->
  <rect x="692" y="100" width="628" height="404" rx="14" fill="#f7fdfa" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="714" y="138" font-size="19" font-weight="700" fill="#065f46">B · 无监督学习</text>
  <text x="1320" y="138" font-size="12" fill="#10b981" text-anchor="end">6 个算法</text>
  <text x="714" y="160" font-size="11.5" fill="#475569">没有标签，找结构：簇、密度、低维、频繁项集</text>

  <rect x="714" y="178" width="285" height="68" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="728" y="205" font-size="14" font-weight="700" fill="#065f46">09 K-Means</text>
  <text x="728" y="225" font-size="10.6" fill="#475569">质心迭代，硬聚类</text>

  <rect x="1013" y="178" width="285" height="68" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1027" y="205" font-size="14" font-weight="700" fill="#065f46">10 层次聚类</text>
  <text x="1027" y="225" font-size="10.6" fill="#475569">树状图，不必先定 K</text>

  <rect x="714" y="258" width="285" height="68" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="728" y="285" font-size="14" font-weight="700" fill="#065f46">11 DBSCAN</text>
  <text x="728" y="305" font-size="10.6" fill="#475569">密度可达，抗噪声</text>

  <rect x="1013" y="258" width="285" height="68" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1027" y="285" font-size="14" font-weight="700" fill="#065f46">12 PCA</text>
  <text x="1027" y="305" font-size="10.6" fill="#475569">方差最大方向降维</text>

  <rect x="714" y="338" width="285" height="68" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="728" y="365" font-size="14" font-weight="700" fill="#065f46">13 高斯混合 GMM</text>
  <text x="728" y="385" font-size="10.6" fill="#475569">EM 软聚类，概率密度</text>

  <rect x="1013" y="338" width="285" height="68" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1027" y="365" font-size="14" font-weight="700" fill="#065f46">14 关联规则</text>
  <text x="1027" y="385" font-size="10.6" fill="#475569">Apriori，频繁项集</text>

  <!-- ========== C 深度学习 ========== -->
  <rect x="40" y="526" width="628" height="404" rx="14" fill="#fffdf5" stroke="#fde68a" stroke-width="1.5"/>
  <text x="62" y="564" font-size="19" font-weight="700" fill="#92400e">C · 深度学习</text>
  <text x="668" y="564" font-size="12" fill="#d97706" text-anchor="end">6 个算法</text>
  <text x="62" y="586" font-size="11.5" fill="#475569">多层网络自动学表示，吃大数据与大算力</text>

  <rect x="62" y="604" width="285" height="68" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="76" y="631" font-size="14" font-weight="700" fill="#92400e">15 MLP 多层感知机</text>
  <text x="76" y="651" font-size="10.6" fill="#475569">多层非线性，万能逼近</text>

  <rect x="361" y="604" width="285" height="68" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="375" y="631" font-size="14" font-weight="700" fill="#92400e">16 CNN 卷积网络</text>
  <text x="375" y="651" font-size="10.6" fill="#475569">局部感受野，权值共享</text>

  <rect x="62" y="684" width="285" height="68" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="76" y="711" font-size="14" font-weight="700" fill="#92400e">17 RNN / LSTM</text>
  <text x="76" y="731" font-size="10.6" fill="#475569">序列建模，长短期记忆</text>

  <rect x="361" y="684" width="285" height="68" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="375" y="711" font-size="14" font-weight="700" fill="#92400e">18 Transformer</text>
  <text x="375" y="731" font-size="10.6" fill="#475569">自注意力，大模型基座</text>

  <rect x="62" y="764" width="285" height="68" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="76" y="791" font-size="14" font-weight="700" fill="#92400e">19 GAN</text>
  <text x="76" y="811" font-size="10.6" fill="#475569">对抗生成，样本逼真</text>

  <rect x="361" y="764" width="285" height="68" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="375" y="791" font-size="14" font-weight="700" fill="#92400e">20 扩散模型</text>
  <text x="375" y="811" font-size="10.6" fill="#475569">去噪生成，图像 SOTA</text>

  <!-- ========== D 强化学习 ========== -->
  <rect x="692" y="526" width="628" height="404" rx="14" fill="#fbf8ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="714" y="564" font-size="19" font-weight="700" fill="#5b21b6">D · 强化学习</text>
  <text x="1320" y="564" font-size="12" fill="#8b5cf6" text-anchor="end">4 个算法</text>
  <text x="714" y="586" font-size="11.5" fill="#475569">没有标准答案，靠与环境交互的奖励学策略</text>

  <rect x="714" y="604" width="285" height="86" rx="9" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="728" y="635" font-size="14" font-weight="700" fill="#5b21b6">21 Q-Learning</text>
  <text x="728" y="657" font-size="10.6" fill="#475569">表格型时序差分（TD）</text>
  <text x="728" y="674" font-size="10.6" fill="#475569">SARSA 为同族方法</text>

  <rect x="1013" y="604" width="285" height="86" rx="9" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="1027" y="635" font-size="14" font-weight="700" fill="#5b21b6">22 DQN</text>
  <text x="1027" y="657" font-size="10.6" fill="#475569">Q 网络 + 经验回放</text>
  <text x="1027" y="674" font-size="10.6" fill="#475569">+ 目标网络稳训练</text>

  <rect x="714" y="704" width="285" height="86" rx="9" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="728" y="735" font-size="14" font-weight="700" fill="#5b21b6">23 策略梯度 / A-C</text>
  <text x="728" y="757" font-size="10.6" fill="#475569">直接优化策略分布</text>
  <text x="728" y="774" font-size="10.6" fill="#475569">Actor-Critic 降方差</text>

  <rect x="1013" y="704" width="285" height="86" rx="9" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="1027" y="735" font-size="14" font-weight="700" fill="#5b21b6">24 PPO</text>
  <text x="1027" y="757" font-size="10.6" fill="#475569">裁剪更新，训练稳定</text>
  <text x="1027" y="774" font-size="10.6" fill="#475569">RLHF / 对齐常用</text>

  <text x="714" y="880" font-size="11" fill="#7c3aed">与监督学习的关键差别：没有「正确答案」，只有延迟的奖励信号</text>
  <text x="714" y="480" font-size="11" fill="#059669">四种目标：分群（09–11）· 降维（12）· 概率密度（13）· 频繁项集（14）</text>
  <text x="62" y="880" font-size="11" fill="#b45309">表示学习还有自编码器 / VAE，常与聚类、异常检测配合使用</text>

  <!-- footer -->
  <text x="40" y="968" font-size="12" fill="#64748b">选型顺序：有没有标签 → 数据长什么样（表格 / 图像 / 序列）→ 要预测、要生成，还是要决策</text>
</svg>
