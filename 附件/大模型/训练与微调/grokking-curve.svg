<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
  <defs>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 26px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #111827; }
      .sub   { font: 15px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #6b7280; }
      .ax    { font: 13px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #6b7280; }
      .lbl   { font: 14px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #374151; }
      .small { font: 12px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #6b7280; }
      .phase { font: 14px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #374151; }
      .grid  { stroke: #e5e7eb; stroke-width: 1; }
      .axis  { stroke: #9ca3af; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1080" height="620" fill="#ffffff"/>
  <text x="40" y="44" class="title">Grokking 的典型曲线：验证集在「早停点」之后才起飞</text>
  <text x="40" y="72" class="sub">示意图，非实测数据。横轴为训练步数（对数刻度），纵轴为准确率。</text>

  <!-- 网格 -->
  <g class="grid">
    <line x1="110" y1="110" x2="1020" y2="110"/>
    <line x1="110" y1="200" x2="1020" y2="200"/>
    <line x1="110" y1="290" x2="1020" y2="290"/>
    <line x1="110" y1="380" x2="1020" y2="380"/>
    <line x1="337.5" y1="110" x2="337.5" y2="470"/>
    <line x1="565" y1="110" x2="565" y2="470"/>
    <line x1="792.5" y1="110" x2="792.5" y2="470"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="110" y1="110" x2="110" y2="470" class="axis"/>
  <line x1="110" y1="470" x2="1020" y2="470" class="axis"/>

  <g class="ax" text-anchor="end">
    <text x="100" y="115">100%</text>
    <text x="100" y="205">75%</text>
    <text x="100" y="295">50%</text>
    <text x="100" y="385">25%</text>
    <text x="100" y="475">0%</text>
  </g>
  <g class="ax" text-anchor="middle">
    <text x="110" y="492">10¹</text>
    <text x="337.5" y="492">10²</text>
    <text x="565" y="492">10³</text>
    <text x="792.5" y="492">10⁴</text>
    <text x="1020" y="492">10⁵</text>
  </g>
  <text x="565" y="570" class="ax" text-anchor="middle">训练步数（对数刻度）</text>
  <text x="62" y="290" class="ax" text-anchor="middle" transform="rotate(-90 62 290)">准确率</text>

  <!-- 随机水平 -->
  <line x1="110" y1="466" x2="690" y2="466" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="446" y="450" class="small" text-anchor="start">随机水平 ≈ 1/113 ≈ 0.9%</text>

  <!-- 训练曲线 -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"
    points="110,466 160,458 200,440 240,410 275,370 305,320 330,265 355,215 380,175 405,148 430,128 460,116 500,112 600,110.5 1020,110.5"/>
  <!-- 验证曲线 -->
  <polyline fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"
    points="110,466.5 250,466 400,465.5 550,465 650,463 700,460 730,452 755,435 780,405 800,370 820,325 840,270 860,215 880,170 900,140 925,122 960,114 1020,112"/>

  <circle cx="500" cy="112" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="400" y="102" class="lbl" fill="#2563eb">训练集 100%</text>

  <!-- 早停点 -->
  <line x1="690" y1="110" x2="690" y2="470" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="690" y="100" class="small" text-anchor="middle">常见早停点</text>

  <rect x="450" y="296" width="225" height="76" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="462" y="324" class="lbl" fill="#991b1b">验证集在这里 ≈ 随机</text>
  <text x="462" y="348" class="lbl" fill="#991b1b">这时早停，就看不到后面</text>
  <line x1="562" y1="374" x2="562" y2="456" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#red-arrow)"/>

  <text x="870" y="250" class="lbl" fill="#c2410c">跃迁发生在 10⁴ 步附近</text>

  <!-- 图例 -->
  <rect x="140" y="124" width="232" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="156" y1="148" x2="196" y2="148" stroke="#2563eb" stroke-width="3"/>
  <text x="206" y="153" class="lbl">训练集准确率</text>
  <line x1="156" y1="174" x2="196" y2="174" stroke="#ea580c" stroke-width="3"/>
  <text x="206" y="179" class="lbl">验证集准确率</text>

  <!-- 阶段括号 -->
  <g stroke="#9ca3af" stroke-width="1.2">
    <line x1="110" y1="512" x2="440" y2="512"/>
    <line x1="110" y1="506" x2="110" y2="518"/>
    <line x1="440" y1="506" x2="440" y2="518"/>
    <line x1="440" y1="512" x2="790" y2="512"/>
    <line x1="790" y1="506" x2="790" y2="518"/>
    <line x1="790" y1="512" x2="1020" y2="512"/>
    <line x1="1020" y1="506" x2="1020" y2="518"/>
  </g>
  <text x="275" y="534" class="phase" text-anchor="middle">① 记忆：训练集迅速满分</text>
  <text x="615" y="534" class="phase" text-anchor="middle">② 平台：验证集≈随机，像彻底失败</text>
  <text x="905" y="534" class="phase" text-anchor="middle">③ 跃迁：几千步内冲到 ~99%</text>

  <text x="1020" y="600" class="small" text-anchor="end">示意曲线，结构参照 Power et al. 2022（arXiv:2201.02177）</text>
</svg>
