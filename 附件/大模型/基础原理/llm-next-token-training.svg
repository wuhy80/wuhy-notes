<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #111827; }
      .label { font: 18px sans-serif; fill: #1f2937; }
      .small { font: 15px sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .green { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="520" fill="#ffffff"/>
  <text x="40" y="48" class="title">LLM 的基础训练：预测下一个 token</text>
  <text x="40" y="78" class="small">看起来只是补全文字，但为了补对，模型必须学习语言、知识、结构、模式和隐含规则。</text>

  <rect x="60" y="150" width="250" height="170" class="card"/>
  <text x="185" y="185" class="label" text-anchor="middle">训练文本</text>
  <rect x="90" y="215" width="190" height="50" class="blue"/>
  <text x="185" y="246" class="small" text-anchor="middle">“如果 A>B 且 B>C”</text>
  <text x="185" y="295" class="small" text-anchor="middle">上下文 token 序列</text>

  <path d="M330 235 H410" class="line"/>

  <rect x="430" y="130" width="240" height="210" class="card"/>
  <text x="550" y="165" class="label" text-anchor="middle">Transformer</text>
  <rect x="470" y="200" width="160" height="42" class="orange"/>
  <text x="550" y="227" class="small" text-anchor="middle">注意力机制</text>
  <rect x="470" y="255" width="160" height="42" class="orange"/>
  <text x="550" y="282" class="small" text-anchor="middle">多层非线性变换</text>
  <text x="550" y="325" class="small" text-anchor="middle">学习上下文关系</text>

  <path d="M690 235 H770" class="line"/>

  <rect x="790" y="150" width="230" height="170" class="card"/>
  <text x="905" y="185" class="label" text-anchor="middle">预测分布</text>
  <rect x="825" y="215" width="160" height="50" class="green"/>
  <text x="905" y="246" class="small" text-anchor="middle">“所以 A>C”</text>
  <text x="905" y="295" class="small" text-anchor="middle">下一个 token 概率</text>

  <rect x="190" y="390" width="700" height="66" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="12"/>
  <text x="540" y="417" class="label" text-anchor="middle">长期、大规模、反复训练后</text>
  <text x="540" y="443" class="small" text-anchor="middle">“预测下一个 token”会迫使模型压缩出世界知识、语法、代码模式、推理模板和任务步骤。</text>
</svg>
