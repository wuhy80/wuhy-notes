<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #111827; }
      .label { font: 18px sans-serif; fill: #1f2937; }
      .small { font: 15px sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .data { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .model { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .out { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .code { font: 15px monospace; fill: #111827; }
    </style>
  </defs>
  <rect width="1080" height="620" fill="#ffffff"/>
  <text x="40" y="48" class="title">LLM 为什么会写代码</text>
  <text x="40" y="78" class="small">代码是高度结构化语言：语法严格、模式重复、反馈明确，非常适合被大规模序列模型学习。</text>

  <rect x="55" y="130" width="265" height="345" class="card"/>
  <text x="188" y="165" class="label" text-anchor="middle">训练语料</text>
  <rect x="90" y="200" width="195" height="54" class="data"/>
  <text x="188" y="233" class="small" text-anchor="middle">开源代码</text>
  <rect x="90" y="270" width="195" height="54" class="data"/>
  <text x="188" y="303" class="small" text-anchor="middle">文档与注释</text>
  <rect x="90" y="340" width="195" height="54" class="data"/>
  <text x="188" y="373" class="small" text-anchor="middle">Issue / PR / 示例</text>
  <text x="188" y="440" class="small" text-anchor="middle">学习 API、惯用法、错误模式</text>

  <path d="M340 300 H430" class="line"/>

  <rect x="455" y="130" width="260" height="345" class="card"/>
  <text x="585" y="165" class="label" text-anchor="middle">模型内部能力</text>
  <rect x="490" y="205" width="190" height="50" class="model"/>
  <text x="585" y="236" class="small" text-anchor="middle">语法补全</text>
  <rect x="490" y="270" width="190" height="50" class="model"/>
  <text x="585" y="301" class="small" text-anchor="middle">模式迁移</text>
  <rect x="490" y="335" width="190" height="50" class="model"/>
  <text x="585" y="366" class="small" text-anchor="middle">局部推理</text>
  <rect x="490" y="400" width="190" height="50" class="model"/>
  <text x="585" y="431" class="small" text-anchor="middle">调试与解释</text>

  <path d="M735 300 H825" class="line"/>

  <rect x="850" y="130" width="190" height="345" class="card"/>
  <text x="945" y="165" class="label" text-anchor="middle">输出代码</text>
  <rect x="875" y="205" width="140" height="165" class="out"/>
  <text x="895" y="238" class="code">fn add(a,b){</text>
  <text x="905" y="270" class="code">a + b</text>
  <text x="895" y="302" class="code">}</text>
  <text x="945" y="425" class="small" text-anchor="middle">可执行</text>
  <text x="945" y="450" class="small" text-anchor="middle">可测试</text>

  <rect x="165" y="535" width="750" height="54" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="12"/>
  <text x="540" y="568" class="label" text-anchor="middle">代码能力 = 代码语料 + 严格语法 + API 模式 + 测试反馈 + 指令微调</text>
</svg>
