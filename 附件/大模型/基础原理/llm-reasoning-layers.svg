<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #111827; }
      .label { font: 18px sans-serif; fill: #1f2937; }
      .small { font: 15px sans-serif; fill: #4b5563; }
      .layer { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .mid { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .out { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="620" fill="#ffffff"/>
  <text x="40" y="48" class="title">LLM 推理能力的形成路径</text>
  <text x="40" y="78" class="small">推理不是单一模块，而是多种能力在生成过程中组合出来的结果。</text>

  <rect x="70" y="125" width="210" height="82" class="layer"/>
  <text x="175" y="158" class="label" text-anchor="middle">语言模式</text>
  <text x="175" y="184" class="small" text-anchor="middle">语法、语义、指代</text>

  <rect x="70" y="245" width="210" height="82" class="layer"/>
  <text x="175" y="278" class="label" text-anchor="middle">世界知识</text>
  <text x="175" y="304" class="small" text-anchor="middle">事实、常识、概念</text>

  <rect x="70" y="365" width="210" height="82" class="layer"/>
  <text x="175" y="398" class="label" text-anchor="middle">结构模板</text>
  <text x="175" y="424" class="small" text-anchor="middle">证明、分类、步骤</text>

  <path d="M300 166 H405" class="line"/>
  <path d="M300 286 H405" class="line"/>
  <path d="M300 406 H405" class="line"/>

  <rect x="430" y="205" width="250" height="170" class="mid"/>
  <text x="555" y="245" class="label" text-anchor="middle">上下文表征</text>
  <text x="555" y="277" class="small" text-anchor="middle">把问题、约束、目标</text>
  <text x="555" y="302" class="small" text-anchor="middle">编码到向量空间中</text>
  <text x="555" y="340" class="small" text-anchor="middle">并预测下一步最合理输出</text>

  <path d="M700 290 H805" class="line"/>

  <rect x="830" y="125" width="210" height="82" class="out"/>
  <text x="935" y="158" class="label" text-anchor="middle">分解问题</text>
  <text x="935" y="184" class="small" text-anchor="middle">先做什么后做什么</text>

  <rect x="830" y="245" width="210" height="82" class="out"/>
  <text x="935" y="278" class="label" text-anchor="middle">中间步骤</text>
  <text x="935" y="304" class="small" text-anchor="middle">计算、归纳、匹配</text>

  <rect x="830" y="365" width="210" height="82" class="out"/>
  <text x="935" y="398" class="label" text-anchor="middle">最终答案</text>
  <text x="935" y="424" class="small" text-anchor="middle">生成可读结果</text>

  <rect x="170" y="520" width="740" height="62" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="12"/>
  <text x="540" y="546" class="label" text-anchor="middle">推理能力 = 模式学习 + 表征压缩 + 多步生成 + 反馈对齐</text>
  <text x="540" y="571" class="small" text-anchor="middle">它能有效解决很多任务，但不等于拥有稳定、完备、可证明的符号推理系统。</text>
</svg>
