# 国内镜像站点的 Nginx 配置（由 publish-site.yml 在同步后安装并 reload）
# 关键点：文章入口是**无扩展名文件**，必须用 default_type text/html 返回，
# 否则浏览器会把 HTML 当纯文本显示（就是“界面坏掉”的样子）。

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /var/www/wuhy-notes;
    index index.html;
    default_type text/html;

    auth_basic "wuhy notes";
    auth_basic_user_file /etc/nginx/.htpasswd;
    satisfy any;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 20m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|ico|pdf|zip)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
