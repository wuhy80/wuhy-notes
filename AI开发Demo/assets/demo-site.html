<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 开发 Demo · 入口</title>
<style>
  :root {
    --bg: #070b14;
    --card: #0f1725;
    --card-2: #0c1320;
    --border: #223047;
    --fg: #eef2f8;
    --muted: #8ea3bf;
    --blue: #3b82f6;
    --cyan: #06b6d4;
    --amber: #f59e0b;
    --violet: #a78bfa;
    --pink: #ec4899;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 22px 40px;
    background:
      radial-gradient(1100px 620px at 16% -8%, rgba(59,130,246,.16), transparent 62%),
      radial-gradient(900px 520px at 92% 2%, rgba(168,85,247,.12), transparent 58%),
      var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .dot {
    width: 12px; height: 12px; border-radius: 99px; background: var(--blue);
    box-shadow: 0 0 0 6px rgba(59,130,246,.14), 0 0 22px rgba(59,130,246,.7);
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: .4px; }
  .sub { margin-top: 5px; font-size: 13px; color: var(--muted); }
  .meta { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.7; }
  .meta b { color: var(--fg); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 55%), var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 16px 14px;
    cursor: pointer;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0 auto 0 0; width: 3px;
    background: var(--accent, var(--blue));
    opacity: .9;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent, var(--blue));
    box-shadow: 0 16px 38px rgba(0,0,0,.42);
  }
  .card:focus-visible { outline: 2px solid var(--accent, var(--blue)); outline-offset: 3px; }
  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .icon {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    font-size: 17px; flex-shrink: 0;
    background: color-mix(in srgb, var(--accent, var(--blue)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent, var(--blue)) 45%, transparent);
  }
  .title { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .file { font-size: 10.5px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; margin-top: 2px; }
  .desc { font-size: 12.5px; line-height: 1.65; color: #c6d2e4; margin: 8px 0 10px; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .tag {
    font-size: 10.5px; padding: 2px 8px; border-radius: 99px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .open {
    display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    font-size: 12px; font-weight: 600; color: var(--accent, var(--blue));
    border: 1px solid color-mix(in srgb, var(--accent, var(--blue)) 55%, transparent);
    background: color-mix(in srgb, var(--accent, var(--blue)) 10%, transparent);
    padding: 5px 11px; border-radius: 8px;
  }
  footer {
    margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px;
    font-size: 11.5px; color: var(--muted);
  }
  kbd {
    font-family: ui-monospace, Consolas, monospace; font-size: 10.5px;
    border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px;
    padding: 1px 5px; color: var(--fg); background: var(--card-2);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>AI 开发 Demo</h1>
        <div class="sub">单文件可交互演示 · 双击即开 · 无依赖</div>
      </div>
    </div>
    <div class="meta">
      <div><b>5</b> 个演示 · <b>1</b> 套 3D 装配沙盘</div>
      <div>本页与演示文件放在同一目录</div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    <div>所有页面均为自包含 HTML（Canvas / 原生 JS，无构建、无 CDN），可离线演示。</div>
    <div>快捷键：<kbd>1</kbd>–<kbd>5</kbd> 打开对应演示</div>
  </footer>
</div>

<script>
  const DEMOS = [
    {
      key: '刀装工具3D装配全景沙盘.html',
      title: '刀装工具 · 3D 装配全景沙盘',
      file: '刀装工具3D装配全景沙盘.html',
      desc: '刀柄 / 夹持 / 装刀工装 / 预调量测的五分区装配沙盘。悬浮即显连线与相邻对象名，按上游（供给）与下游（作用）分色；四套装刀推演支持逐步播放。',
      tags: ['Canvas 2D', '手写透视投影', '悬浮方向分色', '步骤推演'],
      icon: '🔧', accent: '#3b82f6'
    },
    {
      key: 'demo-twin.html',
      title: '伺服轴数字孪生 · CNC-012 实时镜像',
      file: 'demo-twin.html',
      desc: '单台数控机床的实时镜像：健康度、三轴负载、刀具寿命、24h 趋势，以及「监控 → 报警 → AI 分析 → 人工研判 → 工单 → 下发」六环节闭环。',
      tags: ['数字孪生', '六环节闭环', '实时看板', '报警联动'],
      icon: '📡', accent: '#f59e0b'
    },
    {
      key: '汽车零部件3D本体全景沙盘.html',
      title: '汽车零部件 · 3D 本体全景沙盘',
      file: '汽车零部件3D本体全景沙盘.html',
      desc: '刀装沙盘的参考基线：75 个本体节点、5 大分区、6 类接口契约与 731 张源表的 SQL 映射，用来对照「本体沙盘」该长什么样。',
      tags: ['Canvas 2D', 'Ontology', '接口契约', 'SQL 映射'],
      icon: '🚗', accent: '#06b6d4'
    },
    {
      key: 'demo-3d.html',
      title: '伺服轴生产 · 3D 全闭环叙事',
      file: 'demo-3d.html',
      desc: '伺服轴产线的六段式叙事页：从订单、排程、加工到质量与能耗，滚动推进的全闭环演示。',
      tags: ['滚动叙事', '制造全流程', '开场页'],
      icon: '⚙️', accent: '#a78bfa'
    },
    {
      key: '伺服轴智能运维Demo演示脚本.html',
      title: '伺服轴智能运维 · 演示脚本',
      file: '伺服轴智能运维Demo演示脚本.html',
      desc: '七幕场景说明，讲清每个 Demo 画面在讲什么、谁来讲、讲给谁听。适合作为汇报前的串场稿。',
      tags: ['场景脚本', '汇报串场', '叙事结构'],
      icon: '🎬', accent: '#ec4899'
    }
  ];

  const grid = document.getElementById('grid');

  DEMOS.forEach((d, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.style.setProperty('--accent', d.accent);
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="card-top">
        <div class="icon">${d.icon}</div>
        <div>
          <div class="title">${d.title}</div>
          <div class="file">${d.file}</div>
        </div>
      </div>
      <div class="desc">${d.desc}</div>
      <div class="tags">${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <span class="open">打开演示 ↗</span>
    `;
    const open = () => window.open(encodeURI(d.key), '_blank');
    card.addEventListener('click', open);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
    grid.appendChild(card);
  });

  window.addEventListener('keydown', e => {
    const n = Number(e.key);
    if (n >= 1 && n <= DEMOS.length) window.open(encodeURI(DEMOS[n - 1].key), '_blank');
  });
</script>
</body>
</html>
