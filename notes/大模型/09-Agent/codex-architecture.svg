<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="46" y="48" font-size="23" font-weight="700" fill="#0f172a">Codex（codex-rs）分层架构</text>
  <text x="46" y="74" font-size="13" fill="#64748b">模型在服务端 · 运行时在本地 · UI 只消费事件流</text>

  <!-- ① 外壳层 -->
  <text x="46" y="106" font-size="13" font-weight="700" fill="#475569">① 外壳层（多入口）</text>

  <rect x="46" y="116" width="220" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="156" y="143" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">TUI</text>
  <text x="156" y="163" font-size="11.5" fill="#475569" text-anchor="middle">交互式终端界面</text>

  <rect x="278" y="116" width="220" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="388" y="143" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">codex exec</text>
  <text x="388" y="163" font-size="11.5" fill="#475569" text-anchor="middle">非交互 · CI / 脚本</text>

  <rect x="510" y="116" width="220" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="620" y="143" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">app-server</text>
  <text x="620" y="163" font-size="11.5" fill="#475569" text-anchor="middle">IDE / SDK · JSON-RPC</text>

  <rect x="742" y="116" width="220" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="852" y="143" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">codex cloud</text>
  <text x="852" y="163" font-size="11.5" fill="#475569" text-anchor="middle">云端任务 · apply 回本地</text>

  <rect x="974" y="116" width="220" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1084" y="143" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">MCP server</text>
  <text x="1084" y="163" font-size="11.5" fill="#475569" text-anchor="middle">把自身暴露为工具</text>

  <line x1="156" y1="182" x2="156" y2="199" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="388" y1="182" x2="388" y2="199" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="182" x2="620" y2="199" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="852" y1="182" x2="852" y2="199" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1084" y1="182" x2="1084" y2="199" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ② 协议层 -->
  <rect x="46" y="202" width="1148" height="48" rx="10" fill="#1e293b"/>
  <text x="620" y="231" font-size="14" fill="#f1f5f9" text-anchor="middle">② 协议层 protocol：Op / EventMsg（SQ · EQ 双队列；channel / stdio / TCP / HTTP2 皆可）</text>

  <line x1="620" y1="250" x2="620" y2="285" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ③ 内核 -->
  <rect x="46" y="288" width="1148" height="272" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="318" font-size="14" font-weight="700" fill="#334155">③ 内核 codex-core</text>

  <rect x="64" y="330" width="538" height="100" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="360" font-size="15" font-weight="700" fill="#0f172a">Session / Task / Turn</text>
  <text x="84" y="384" font-size="12" fill="#475569">会话配置、任务生命周期、单轮循环（一次模型往返 + 工具执行）</text>
  <text x="84" y="406" font-size="12" fill="#475569">同一 Session 同时只跑一个 Task；并行靠多实例</text>

  <rect x="638" y="330" width="538" height="100" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="658" y="360" font-size="15" font-weight="700" fill="#0f172a">ToolRouter</text>
  <text x="658" y="384" font-size="12" fill="#475569">shell / unified_exec · apply_patch · plan · MCP · 子代理</text>
  <text x="658" y="406" font-size="12" fill="#475569">工具输出截断 + Exit code / Wall time 格式化</text>

  <rect x="64" y="446" width="538" height="100" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="476" font-size="15" font-weight="700" fill="#0f172a">ContextManager</text>
  <text x="84" y="500" font-size="12" fill="#475569">50+ 上下文片段：环境、权限、AGENTS.md、token 预算</text>
  <text x="84" y="522" font-size="12" fill="#475569">静态前缀稳定 + 动态事实下沉，兼顾 prompt cache</text>

  <rect x="638" y="446" width="538" height="100" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="658" y="476" font-size="15" font-weight="700" fill="#0f172a">Compact / Rollout</text>
  <text x="658" y="500" font-size="12" fill="#475569">本地摘要兜底 + 远端压缩路径</text>
  <text x="658" y="522" font-size="12" fill="#475569">线程落盘、resume / fork、response_id 书签</text>

  <line x1="324" y1="560" x2="324" y2="593" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="914" y1="560" x2="914" y2="593" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ④ 执行与模型 -->
  <text x="46" y="586" font-size="13" font-weight="700" fill="#475569">④ 执行与模型</text>

  <rect x="46" y="596" width="560" height="96" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="66" y="626" font-size="14.5" font-weight="700" fill="#065f46">exec-server / unified_exec</text>
  <text x="66" y="650" font-size="12" fill="#334155">本地或远端进程 · PTY · 长驻 shell · 分块输出</text>
  <text x="66" y="672" font-size="12" fill="#334155">命令先过 execpolicy，再套沙箱包装执行</text>

  <rect x="634" y="596" width="560" height="96" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="654" y="626" font-size="14.5" font-weight="700" fill="#92400e">codex-api → POST /responses</text>
  <text x="654" y="650" font-size="12" fill="#334155">SSE 流式：推理摘要 · 正文 · function_call</text>
  <text x="654" y="672" font-size="12" fill="#334155">models-manager 下发每模型提示词与能力位（tools / context_window）</text>

  <!-- ⑤ 横切 -->
  <text x="46" y="720" font-size="13" font-weight="700" fill="#6d28d9">⑤ 横切：安全与扩展（作用于内核与执行层）</text>

  <rect x="46" y="730" width="1148" height="120" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="7 6"/>

  <rect x="60" y="768" width="360" height="70" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="78" y="792" font-size="13.5" font-weight="700" fill="#5b21b6">沙箱 sandboxing</text>
  <text x="78" y="813" font-size="11" fill="#475569">Seatbelt · Landlock+seccomp · bwrap</text>
  <text x="78" y="829" font-size="11" fill="#475569">Windows 受限令牌 / MXC</text>

  <rect x="440" y="768" width="360" height="70" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="458" y="792" font-size="13.5" font-weight="700" fill="#5b21b6">审批与策略</text>
  <text x="458" y="813" font-size="11" fill="#475569">execpolicy（Starlark 前缀规则）</text>
  <text x="458" y="829" font-size="11" fill="#475569">guardian 复核模型 · 网络代理白名单</text>

  <rect x="820" y="768" width="360" height="70" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="838" y="792" font-size="13.5" font-weight="700" fill="#5b21b6">扩展面</text>
  <text x="838" y="813" font-size="11" fill="#475569">MCP · skills · plugins · hooks</text>
  <text x="838" y="829" font-size="11" fill="#475569">multi-agent · code mode（实验）</text>

  <text x="46" y="878" font-size="11" fill="#94a3b8">依据 openai/codex main 分支（2026-11）；guardian、code mode、multi-agent 仍属实验特性。</text>
</svg>
