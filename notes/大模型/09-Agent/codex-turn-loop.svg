<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="46" y="48" font-size="22" font-weight="700" fill="#0f172a">一次 Turn 的执行链路</text>
  <text x="46" y="73" font-size="12.5" fill="#64748b">模型只负责决策，权限检查与命令执行都在本地运行时完成</text>

  <!-- 1 -->
  <rect x="46" y="96" width="1010" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="78" cy="129" r="16" fill="#1e293b"/>
  <text x="78" y="134" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="110" y="123" font-size="15" font-weight="700" fill="#0f172a">组装 Prompt</text>
  <text x="110" y="145" font-size="11.5" fill="#475569">base instructions + 历史 + 上下文片段（环境 / 权限 / AGENTS.md）+ 工具 schema</text>

  <!-- 2 -->
  <rect x="46" y="180" width="1010" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="78" cy="213" r="16" fill="#1e293b"/>
  <text x="78" y="218" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="110" y="207" font-size="15" font-weight="700" fill="#0f172a">请求模型</text>
  <text x="110" y="229" font-size="11.5" fill="#475569">POST /responses，SSE 流式返回推理摘要、正文与 function_call</text>

  <!-- 3 -->
  <rect x="46" y="264" width="1010" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="78" cy="297" r="16" fill="#1e293b"/>
  <text x="78" y="302" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="110" y="291" font-size="15" font-weight="700" fill="#0f172a">工具路由与策略判定</text>
  <text x="110" y="313" font-size="11.5" fill="#475569">ToolRouter 分发；execpolicy 按 Starlark 前缀规则判 allow / prompt / forbid</text>

  <!-- 4 -->
  <rect x="46" y="348" width="1010" height="66" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="78" cy="381" r="16" fill="#c2410c"/>
  <text x="78" y="386" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="110" y="375" font-size="15" font-weight="700" fill="#7c2d12">审批</text>
  <text x="110" y="397" font-size="11.5" fill="#475569">需要时弹窗询问用户；配置 auto_review 时由 guardian 复核模型判定合规性</text>

  <!-- 5 -->
  <rect x="46" y="432" width="1010" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="78" cy="465" r="16" fill="#1e293b"/>
  <text x="78" y="470" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="110" y="459" font-size="15" font-weight="700" fill="#0f172a">执行</text>
  <text x="110" y="481" font-size="11.5" fill="#475569">沙箱内运行命令，或 apply_patch（与 shell 共用同一套路径与权限检查）</text>

  <!-- 6 -->
  <rect x="46" y="516" width="1010" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="78" cy="549" r="16" fill="#1e293b"/>
  <text x="78" y="554" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="110" y="543" font-size="15" font-weight="700" fill="#0f172a">结果回填</text>
  <text x="110" y="565" font-size="11.5" fill="#475569">输出截断并格式化，作为 function_call_output 追加历史，回到第 2 步</text>

  <!-- 7 -->
  <rect x="46" y="600" width="1010" height="66" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <circle cx="78" cy="633" r="16" fill="#059669"/>
  <text x="78" y="638" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="110" y="627" font-size="15" font-weight="700" fill="#065f46">结束 turn</text>
  <text x="110" y="649" font-size="11.5" fill="#334155">模型不再发出工具调用即结束；rollout 落盘；接近 token 预算时触发 compact</text>

  <!-- 循环箭头 -->
  <path d="M1056 549 H1090 V213 H1062" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="1112" y="381" font-size="11.5" fill="#64748b" text-anchor="middle" transform="rotate(-90 1112 381)">每轮循环：结果回填后重新请求</text>

  <text x="46" y="706" font-size="11.5" fill="#94a3b8">一轮 = 一次模型往返 + 它要求的全部工具调用；任务（Task）由若干轮组成，直到不再需要工具。</text>
</svg>
