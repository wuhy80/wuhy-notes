<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660">
  <defs>
    <marker id="gr-arrow" markerWidth="9" markerHeight="9" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font: 700 26px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #111827; }
      .sub   { font: 15px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #6b7280; }
      .ax    { font: 13px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #6b7280; }
      .lbl   { font: 14px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #374151; }
      .small { font: 12px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #6b7280; }
      .cardh { font: 700 19px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
      .axis  { stroke: #9ca3af; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1080" height="660" fill="#ffffff"/>
  <text x="40" y="44" class="title">机理视角的三段式：记忆 → 回路形成 → 清理</text>
  <text x="40" y="72" class="sub">模型不是「突然懂了」，而是内部支持答案的那条通路被换掉了。</text>

  <!-- 三张卡片 -->
  <rect x="50" y="100" width="360" height="140" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.6"/>
  <text x="70" y="134" class="cardh" fill="#4338ca">① 记忆阶段</text>
  <text x="70" y="168" class="lbl">用「查表」把训练样本背下来</text>
  <text x="70" y="196" class="lbl">训练准确率 → 100%</text>
  <text x="70" y="222" class="lbl">验证准确率 ≈ 随机水平</text>

  <rect x="50" y="260" width="360" height="140" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="70" y="294" class="cardh" fill="#0e7490">② 回路形成</text>
  <text x="70" y="328" class="lbl">梯度在慢慢搭一条傅里叶电路</text>
  <text x="70" y="356" class="lbl">它的贡献被记忆解盖住了</text>
  <text x="70" y="382" class="lbl">restricted loss 开始下降</text>

  <rect x="50" y="420" width="360" height="140" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="70" y="454" class="cardh" fill="#047857">③ 清理阶段</text>
  <text x="70" y="488" class="lbl">weight decay 把记忆解压垮</text>
  <text x="70" y="516" class="lbl">傅里叶回路接管输出</text>
  <text x="70" y="542" class="lbl">验证准确率断崖式上升</text>

  <line x1="230" y1="240" x2="230" y2="256" stroke="#6b7280" stroke-width="2" marker-end="url(#gr-arrow)"/>
  <line x1="230" y1="400" x2="230" y2="416" stroke="#6b7280" stroke-width="2" marker-end="url(#gr-arrow)"/>

  <!-- 图表 -->
  <rect x="450" y="110" width="190" height="430" fill="#eef2ff" opacity="0.55"/>
  <rect x="640" y="110" width="250" height="430" fill="#ecfeff" opacity="0.55"/>
  <rect x="890" y="110" width="140" height="430" fill="#ecfdf5" opacity="0.55"/>
  <line x1="640" y1="110" x2="640" y2="540" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="890" y1="110" x2="890" y2="540" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="4 4"/>

  <g stroke="#eef0f3" stroke-width="1">
    <line x1="450" y1="140" x2="1030" y2="140"/>
    <line x1="450" y1="240" x2="1030" y2="240"/>
    <line x1="450" y1="340" x2="1030" y2="340"/>
    <line x1="450" y1="440" x2="1030" y2="440"/>
  </g>

  <line x1="450" y1="110" x2="450" y2="540" class="axis"/>
  <line x1="450" y1="540" x2="1030" y2="540" class="axis"/>

  <g class="ax" text-anchor="end">
    <text x="440" y="145">1.0</text>
    <text x="440" y="245">0.75</text>
    <text x="440" y="345">0.5</text>
    <text x="440" y="445">0.25</text>
    <text x="440" y="545">0</text>
  </g>
  <g class="ax" text-anchor="middle">
    <text x="450" y="562">10²</text>
    <text x="643" y="562">10³</text>
    <text x="837" y="562">10⁴</text>
    <text x="1030" y="562">10⁵</text>
  </g>
  <text x="740" y="590" class="ax" text-anchor="middle">训练步数（对数刻度）</text>
  <text x="430" y="325" class="ax" text-anchor="middle" transform="rotate(-90 430 325)">归一化强度</text>

  <!-- 记忆分数 -->
  <polyline fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"
    points="450,540 480,505 510,455 540,395 570,330 600,270 630,225 660,203 700,194 740,192 780,196 820,207 850,228 875,268 892,320 905,380 920,450 935,505 955,530 1030,536"/>

  <!-- 回路强度 -->
  <polyline fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round"
    points="450,540 560,539 640,536 700,526 750,508 790,483 820,450 845,410 865,365 885,310 900,255 915,205 930,170 950,152 980,146 1030,144"/>

  <!-- 图例 -->
  <rect x="462" y="116" width="214" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="474" y1="138" x2="510" y2="138" stroke="#ea580c" stroke-width="3"/>
  <text x="520" y="143" class="lbl">记忆分数</text>
  <line x1="474" y1="160" x2="510" y2="160" stroke="#0d9488" stroke-width="3"/>
  <text x="520" y="165" class="lbl">傅里叶回路强度</text>

  <!-- 跃升标记 -->
  <rect x="918" y="388" width="104" height="74" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="970" y="416" class="lbl" text-anchor="middle" fill="#9a3412">验证准确率</text>
  <text x="970" y="440" class="lbl" text-anchor="middle" fill="#9a3412">在此跃升</text>

  <text x="40" y="626" class="small">三阶段划分来自 Nanda et al. 2023 对模加法任务的机制分析；曲线为定性示意。</text>
</svg>
